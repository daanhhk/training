      <header id="appbar" class="appbar" style="display:none">
        <div class="appbar-brand"><span class="appbar-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 512 512"><defs><linearGradient id="cadans-mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"></stop><stop offset="1" style="stop-color:var(--accent-strong)"></stop></linearGradient></defs><g transform="translate(86,0) skewX(-12)" fill="url(#cadans-mark)"><rect x="150" y="300" width="56" height="118" rx="14"></rect><rect x="230" y="232" width="56" height="186" rx="14"></rect><rect x="310" y="150" width="56" height="268" rx="14"></rect></g></svg></span><span id="appbar-name">COACH</span></div>

      <!-- SCHEMA (Vandaag + Kalender samengevoegd) -->

      <section id="tab-vorm" class="tab" style="display:none">

            <div class="deck-slide" id="vorm-level"></div>

            <span class="deck-dot" data-slide="1"></span>
          </div>
          <div id="vorm-metrics"></div>
          <div id="vorm-balans"></div>

            <span class="deck-dot" data-slide="1"></span>
          </div>
          <div id="trainingen-views"></div>
        </div>
      </section>

      <!-- NIVEAU (Fase 7, v1) — vermogen-snapshot + progressie-trajectorie -->
      <section id="tab-niveau" style="display:none">

        <div id="niveau-prog"></div>
        <div id="niveau-soon"></div>
