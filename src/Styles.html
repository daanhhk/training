<style>
  :root {
    --bg: #EDF1F5;
    --header: #0E1726;
    --card: #FFFFFF;
    --ink: #11203A;
    --muted: #6B7A90;
    --accent: #5B5BD6;
    --accent-soft: #E8E8FB;
    /* semantische statuskleuren (blijven semantisch) */
    --ok-bg: #d1fae5;   --ok-ink: #065f46;
    --warn-bg: #fef9c3; --warn-ink: #854d0e;
    --dem-bg: #fef3c7;  --dem-ink: #92400e;
    --rec-bg: #fee2e2;  --rec-ink: #991b1b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-size: var(--fs-body); line-height: var(--lh-body);
    background: var(--header); color: var(--ink);
  }
  #app { max-width: 100%; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 70px; }
  .loading, .error { padding: 40px 20px; text-align: center; color: #e2e8f0; }
  .error { color: #fca5a5; }

  .appbar { display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 5; background: var(--bg-app); padding: var(--s-3) var(--s-4); }
  .appbar-brand { display: flex; align-items: center; gap: var(--s-2); font-size: var(--fs-h1); font-weight: var(--fw-h1); letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-primary); }
  .appbar-logo { width: 6px; height: 22px; background: var(--accent-grad); border-radius: 1px; transform: skewX(-12deg); flex: 0 0 auto; }
  .appbar-right { display: flex; align-items: center; gap: var(--s-3); }
  .appbar-week { font-family: var(--font-num); font-size: var(--fs-label); color: var(--text-muted); white-space: nowrap; }
  .appbar-avatar { width: 40px; height: 40px; border-radius: var(--r-pill); border: 1px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); background: var(--bg-elevated); color: var(--text-primary); font-family: var(--font-num); font-size: var(--fs-label); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; }
  .body { padding: var(--s-4); }

  .card {
    background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--card-radius);
    padding: var(--card-pad); margin-bottom: var(--s-4); box-shadow: var(--card-shadow);
  }
  .card h3 { margin: 0 0 8px; font-size: var(--fs-h2); color: var(--text-primary); }
  .muted { color: var(--text-muted); font-size: var(--fs-label); }
  .accent { color: var(--accent); }

  .banner { border-radius: 14px; padding: var(--s-3) var(--s-4); margin-bottom: var(--s-4); font-weight: 600; font-size: var(--fs-h3); }
  .b-normaal  { background: var(--ok-bg);  color: var(--ok-ink); }
  .b-warning  { background: var(--warn-bg); color: var(--warn-ink); }
  .b-demote   { background: var(--dem-bg);  color: var(--dem-ink); }
  .b-recovery { background: var(--rec-bg);  color: var(--rec-ink); }

  .metrics { display: flex; gap: var(--s-3); margin: var(--s-3) 0; }
  .metric { flex: 1; background: var(--accent-soft); border-radius: 12px; padding: 10px; text-align: center; }
  .metric .v { font-size: 20px; font-weight: 700; color: var(--accent); }
  .metric .l { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Fase 3a — Schema dag-detail (workout-kaart, skin §1d) */
  .wk-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--card-pad); margin-bottom: var(--s-4); }
  .wk-overline { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); }
  .wk-today { color: var(--accent); }
  .wk-ok { color: var(--good); }
  .wk-name { font-size: var(--fs-h1); font-weight: var(--fw-h1); color: var(--text-primary); margin: 4px 0 6px; }
  .wk-zonebar { display: block; width: 100%; height: 110px; margin: var(--s-3) 0; }
  .wk-minibar { display: block; width: 100%; height: 40px; margin: 8px 0; }
  .wk-metrics { display: flex; margin: var(--s-3) 0 4px; background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-md); overflow: hidden; }
  .wk-metric { flex: 1; padding: var(--s-3) 4px; text-align: center; }
  .wk-metric + .wk-metric { border-left: 1px solid var(--border-subtle); }
  .wk-mv { font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-num-md); color: var(--text-primary); }
  .wk-ml { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: var(--tracking-overline); }
  .wk-note { font-size: var(--fs-label); color: var(--text-secondary); margin-top: 8px; }
  .wk-inline { margin: var(--s-3) 0 var(--s-1); font-size: var(--fs-label); color: var(--text-secondary); }
  .wk-im-n { font-family: var(--font-num); font-weight: var(--fw-num-sm); color: var(--text-primary); }
  .wk-sub { background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 12px; margin-top: var(--s-3); }
  .wk-sub-name { font-size: var(--fs-h3); font-weight: var(--fw-h3); color: var(--text-primary); }
  .wk-why { margin-top: var(--s-3); background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); padding: 8px 12px; }
  .wk-why > summary { cursor: pointer; font-size: var(--fs-label); font-weight: var(--fw-label); color: var(--text-secondary); list-style: none; }
  .wk-why > summary::-webkit-details-marker { display: none; }
  .wk-why ul { margin: 8px 0 0; padding-left: 18px; }
  .wk-why li { font-size: var(--fs-label); color: var(--text-secondary); margin-bottom: 4px; }
  /* Schema deel 2 pass 1 — §1d zone-badge / ZoneLegend / Blokstructuur */
  .wk-head-row { display: flex; align-items: center; gap: 8px; }
  .wk-head-row .wk-overline { flex: 1; }
  .zbadge { flex: 0 0 auto; border: 1px solid; border-radius: var(--r-sm); padding: 1px 7px; font-family: var(--font-num); font-size: var(--fs-caption); font-weight: var(--fw-caption); }
  .wk-blocks { margin: 4px 0; }
  .wk-blocks > summary { list-style: none; cursor: pointer; }
  .wk-blocks > summary::-webkit-details-marker { display: none; }
  .zleg { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-top: 6px; }
  .zleg-item { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-caption); color: var(--text-secondary); }
  .zleg-dot { width: 8px; height: 8px; border-radius: 2px; }
  .bloklist { margin-top: 8px; background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); overflow: hidden; }
  .blok-row { display: flex; justify-content: space-between; padding: 7px 12px; font-size: var(--fs-label); }
  .blok-row + .blok-row { border-top: 1px solid var(--border-subtle); }
  .blok-zone { font-family: var(--font-num); font-weight: var(--fw-num-sm); }
  .blok-min { color: var(--text-secondary); font-family: var(--font-num); }
  .wk-blokhint { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 4px; font-size: var(--fs-caption); color: var(--text-muted); }
  .wk-chev { transition: transform 200ms ease; }
  .wk-blocks[open] .wk-chev { transform: rotate(180deg); }

  /* Fase 3b — WeekLoad-kaart (deze week, gepland vs gedaan) */
  .wl-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--card-pad); margin: 0; }
  .wl-head { display: flex; align-items: center; gap: var(--s-3); }
  .wl-overline { flex: 1; font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); }
  .wl-refresh { flex: 0 0 auto; width: 34px; height: 34px; border-radius: var(--r-pill); background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--accent); font-size: 17px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .wl-refresh:disabled { cursor: default; }
  .wl-check { color: var(--good); }
  .wl-spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--text-muted); animation: wl-rot 0.7s linear infinite; }
  @keyframes wl-rot { to { transform: rotate(360deg); } }
  .wl-stats { display: flex; margin: 12px 0; background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-md); overflow: hidden; }
  .wl-stat { flex: 1; padding: var(--s-3) 4px; text-align: center; }
  .wl-stat + .wl-stat { border-left: 1px solid var(--border-subtle); }
  .wl-sv { font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-num-md); color: var(--text-primary); }
  .wl-sl { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: var(--tracking-overline); }
  .wl-den { font-size: var(--fs-num-sm); color: var(--text-muted); margin-left: 2px; }
  .wl-prog { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .wl-prog-l { font-size: var(--fs-label); color: var(--text-secondary); }
  .wl-prog-r { font-size: var(--fs-label); color: var(--text-primary); }
  .wl-bar { height: 8px; border-radius: var(--r-pill); background: var(--bg-sunken); overflow: hidden; }
  .wl-bar-fill { height: 100%; background: var(--accent-grad); border-radius: var(--r-pill); transition: width 300ms ease; }
  .wl-stale { margin-top: var(--s-3); background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 8px 12px; font-size: var(--fs-label); }
  .wl-sync { margin-top: 8px; font-size: var(--fs-caption); color: var(--text-muted); }

  /* Fase 3c — RPE-rating (web-write) + skip-dispositie */
  .rpe-rate { margin-top: 12px; }
  .rpe-label { font-size: var(--fs-caption); color: var(--text-muted); text-transform: uppercase; letter-spacing: var(--tracking-overline); margin-bottom: 8px; }
  .rpe-row { display: flex; gap: 4px; }
  .rpe-btn { flex: 1; height: 34px; padding: 0; border: 1px solid var(--border-strong); background: var(--bg-sunken); color: var(--text-secondary); border-radius: var(--r-sm); font-family: var(--font-num); font-size: var(--fs-num-sm); cursor: pointer; }
  .rpe-btn.is-on { background: var(--accent); color: var(--text-on-accent); border-color: transparent; box-shadow: 0 0 0 2px var(--accent-ring); }
  .rpe-feedback { margin-top: var(--s-3); background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); padding: 8px 12px; font-size: var(--fs-label); }
  .disp-afford { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .disp-q { font-size: var(--fs-label); color: var(--text-secondary); margin-bottom: 8px; }
  .disp-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .disp-btn { flex: 1; min-width: 92px; height: 38px; border: 1px solid var(--btn-secondary-border); background: var(--btn-secondary-bg); color: var(--btn-secondary-text); border-radius: var(--btn-radius); font-family: var(--font-sans); font-size: var(--fs-label); cursor: pointer; }
  .gemist-card { display: flex; align-items: center; gap: var(--s-3); background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--card-radius); padding: var(--s-4) var(--card-pad); margin-bottom: var(--s-4); }
  .gemist-txt { flex: 1; color: var(--text-muted); font-size: var(--fs-body); }
  .gemist-back { flex: 0 0 auto; background: none; border: none; color: var(--accent); font-size: var(--fs-label); font-weight: var(--fw-label); cursor: pointer; padding: 4px 6px; }

  /* Fase 3 deel 1 — Vorm LevelCard (export §2b; deelt de rc-card-skin) */
  .lc-head { display: flex; align-items: center; gap: var(--s-3); }
  .lc-head .rc-overline { flex: 1; }
  .lc-chip { flex: 0 0 auto; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-pill); padding: 3px 10px; font-size: var(--fs-caption); font-weight: var(--fw-caption); white-space: nowrap; }
  .lc-row { display: flex; align-items: baseline; gap: var(--s-3); margin-top: var(--s-2); }
  .lc-num { flex: 1; font-family: var(--font-num); font-size: var(--fs-num-lg); font-weight: var(--fw-num-lg); color: var(--text-primary); line-height: 1; }
  .lc-max { font-size: var(--fs-num-md); color: var(--text-muted); margin-left: 4px; }
  .lc-delta { font-family: var(--font-num); font-size: var(--fs-num-sm); font-weight: var(--fw-num-sm); }
  .lc-up { color: var(--good); }
  .lc-down { color: var(--bad); }
  .lc-wkg { font-size: var(--fs-label); color: var(--text-secondary); margin-top: 4px; }
  .lc-bar { height: 8px; border-radius: var(--r-pill); background: var(--bg-sunken); overflow: hidden; margin-top: var(--s-3); }
  .lc-bar-fill { height: 100%; background: var(--accent-grad); border-radius: var(--r-pill); }

  /* Fase 3 deel 4 — Vorm swipe-deck + LevelCard tier-chip/delta/blok-% */
  .deck { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .deck::-webkit-scrollbar { display: none; }
  .deck-slide { flex: 0 0 100%; scroll-snap-align: center; }
  .deck-slide > .rc-card { margin-bottom: 0; }
  .deck-dots { display: flex; justify-content: center; gap: 6px; margin: 8px 0 14px; }
  .deck-dot { width: 7px; height: 7px; padding: 0; border: none; border-radius: var(--r-pill); background: var(--border-strong); cursor: pointer; }
  .deck-dot.active { background: var(--accent); }

  /* ── Trainingen-tab (Fase 4): bibliotheek-drill-down (cats/category/workout) ── */
  .trn-overline { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); margin: var(--s-2) 2px var(--s-3); }
  .cat-card { display: flex; align-items: center; gap: var(--s-3); width: 100%; text-align: left; font-family: var(--font-sans); background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: 13px var(--card-pad); margin-bottom: var(--s-3); cursor: pointer; }
  .cat-marker { flex: 0 0 auto; width: 4px; align-self: stretch; min-height: 32px; border-radius: var(--r-pill); }
  .cat-body { flex: 1; min-width: 0; }
  .cat-name { font-size: var(--fs-h3); font-weight: var(--fw-h3); }
  .cat-desc { font-size: var(--fs-label); color: var(--text-muted); margin-top: 2px; }
  .cat-count { flex: 0 0 auto; font-family: var(--font-num); font-size: var(--fs-label); color: var(--text-muted); }
  .cat-chev { flex: 0 0 auto; color: var(--text-muted); font-size: var(--fs-h3); line-height: 1; }
  .trn-back { display: flex; align-items: center; gap: var(--s-3); margin: var(--s-1) 0 var(--s-4); }
  .trn-back-btn { flex: 0 0 auto; width: 34px; height: 34px; border-radius: var(--r-pill); border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text-primary); font-size: var(--fs-h3); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .trn-back-title { font-size: var(--fs-h1); font-weight: var(--fw-h1); color: var(--text-primary); }
  .trn-back-sub { font-size: var(--fs-label); color: var(--text-muted); margin-top: 1px; }
  .dur-card { background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-md); padding: 13px var(--card-pad); margin-bottom: var(--s-4); }
  .dur-head { display: flex; align-items: baseline; justify-content: space-between; }
  .dur-lbl { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); }
  .dur-val { font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-num-md); color: var(--accent); }
  .dur-slider { width: 100%; margin: 12px 0 6px; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: var(--slider-track); outline: none; }
  .dur-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: none; }
  .dur-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: none; }
  .dur-minmax { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--text-muted); }
  .var-row { display: block; width: 100%; text-align: left; font-family: var(--font-sans); background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--card-pad); margin-bottom: var(--s-3); cursor: pointer; }
  .var-head { display: flex; align-items: center; gap: var(--s-2); }
  .var-name { flex: 1; font-size: var(--fs-h3); font-weight: var(--fw-h3); color: var(--text-primary); }
  .var-badge { flex: 0 0 auto; background: var(--badge-good-bg); color: var(--badge-good-text); border-radius: var(--r-pill); padding: 2px 10px; font-size: var(--fs-caption); font-weight: var(--fw-caption); }
  .trn-plan-btn { width: 100%; height: var(--btn-height); margin-top: var(--s-3); border: none; border-radius: var(--btn-radius); background: var(--btn-primary-bg); color: var(--btn-primary-text); font-family: var(--font-sans); font-size: var(--fs-body); font-weight: 600; cursor: pointer; }
  .trn-plan-btn:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-text); cursor: default; }
  /* Day-override (Fase 4): OverriddenDetail / FreeRideCard + WorkoutPicker */
  .trn-pick-btn { width: 100%; height: var(--btn-height); margin-top: var(--s-4); border: 1px solid var(--btn-secondary-border); border-radius: var(--btn-radius); background: var(--btn-secondary-bg); color: var(--btn-secondary-text); font-family: var(--font-sans); font-size: var(--fs-label); font-weight: 600; cursor: pointer; }
  .ov-card { border-color: var(--accent); }
  .ov-pin { display: inline-flex; align-items: center; gap: 6px; background: var(--mode-chip-bg); color: var(--mode-chip-text); border: 1px solid var(--mode-chip-border); border-radius: var(--r-pill); padding: 3px 10px; font-size: var(--fs-caption); font-weight: var(--fw-caption); margin-bottom: var(--s-3); }
  .ov-pin-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .ov-clear { width: 100%; height: var(--btn-height); margin-top: var(--s-3); border: 1px solid var(--btn-secondary-border); border-radius: var(--btn-radius); background: var(--btn-secondary-bg); color: var(--btn-secondary-text); font-family: var(--font-sans); font-size: var(--fs-label); font-weight: 600; cursor: pointer; }
  .fr-meta { display: flex; gap: var(--s-2); margin: var(--s-3) 0; }
  .fr-chip { background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-pill); padding: 4px 12px; font-size: var(--fs-label); color: var(--text-secondary); text-transform: capitalize; }
  .fr-note { font-size: var(--fs-caption); }
  .pk-tile { display: block; width: 100%; text-align: left; font-family: var(--font-sans); background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--card-pad); margin-bottom: var(--s-3); cursor: pointer; }
  .pk-tile-t { font-size: var(--fs-h3); font-weight: var(--fw-h3); color: var(--text-primary); }
  .pk-tile-s { font-size: var(--fs-label); color: var(--text-muted); margin-top: 2px; }

  /* ── Coach-feedback (Fase 4b): DoneDetail (08/09) + GemistDetail (10) ── */
  .dd-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--card-pad); }
  .dd-overline { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-2); }
  .dd-date { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); }
  .align-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--r-pill); padding: 3px 10px; font-size: var(--fs-caption); font-weight: var(--fw-caption); }
  .align-dot { width: 6px; height: 6px; border-radius: 50%; }
  .dd-badge { margin-bottom: 2px; }
  .dd-card .wk-name { margin: 4px 0 var(--s-3); }
  .rd-table { margin: var(--s-3) 0; }
  .rd-row { display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: var(--s-2); align-items: center; padding: 9px 0; }
  .rd-row + .rd-row { border-top: 1px solid var(--reading-divider); }
  .rd-head { padding: 0 0 4px; }
  .rd-lbl { font-size: var(--fs-label); color: var(--text-secondary); }
  .rd-pl { text-align: right; font-size: var(--fs-label); color: var(--reading-planned); font-family: var(--font-num); }
  .rd-done { text-align: right; font-size: var(--fs-label); color: var(--reading-done); font-weight: 700; font-family: var(--font-num); }

  /* ZoneCompare (§1bis) — per-zone gepland-vs-gedaan rijen (vervangt de twee bars) */

  .rd-pct { margin: var(--s-4) 0 2px; }

  /* ── Rit-detail sheet (Fase 1ter) ── */

  .rd-kop { display: flex; align-items: center; gap: var(--s-2); margin: 2px 40px var(--s-2) 0; flex-wrap: wrap; }

  .tiz-bar { display: flex; gap: var(--tiz-gap); height: 14px; border-radius: var(--r-sm); overflow: hidden; background: var(--tiz-track); margin-bottom: 6px; }
  .tiz-seg { min-width: 2px; }

  .tiz-dot { width: 8px; height: 8px; border-radius: 2px; }
  .rd-hero { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--ride-hero-bg); border: 1px solid var(--ride-divider); border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--s-3); }
  .rd-hero-cell { padding: 12px var(--s-3); border-right: 1px solid var(--ride-divider); }
  .rd-hero-cell:last-child { border-right: none; }
  .rd-hero-lbl { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--ride-section-label); }
  .rd-hero-val { font-family: var(--font-num); font-size: var(--fs-num-lg); font-weight: var(--fw-num-lg); color: var(--ride-hero-value); margin-top: 3px; }
  .rd-hero-acc { color: var(--ride-hero-accent); }
  .rd-hero-u { font-size: var(--fs-label); color: var(--ride-metric-unit); font-family: var(--font-sans); }
  .rd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); margin-bottom: var(--s-4); }
  .rd-tile { background: var(--ride-metric-tile-bg); border: 1px solid var(--ride-divider); border-radius: var(--r-md); padding: 11px var(--s-3); }
  .rd-tile-lbl { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--ride-metric-label); }
  .rd-tile-valrow { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; margin-top: 3px; }
  .rd-tile-val { font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-num-md); color: var(--ride-metric-value); }
  .rd-tile-u { font-size: var(--fs-caption); color: var(--ride-metric-unit); font-family: var(--font-sans); }
  .rd-tile-sub { font-size: var(--fs-caption); color: var(--text-muted); font-family: var(--font-num); white-space: nowrap; }
  .rd-sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: var(--s-2) 0; }
  .rd-sec-lbl { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--ride-section-label); }
  .rd-ftp { font-size: var(--fs-caption); color: var(--text-muted); font-family: var(--font-num); }
  .iv-row { display: flex; align-items: center; gap: var(--s-3); background: var(--interval-rest-bg); border: 1px solid var(--ride-divider); border-left: var(--interval-stripe-w) solid; border-radius: var(--r-sm); padding: 10px var(--s-3); margin-bottom: 6px; }
  .iv-row.iv-work { background: var(--interval-row-bg); }

  .iv-head { display: flex; align-items: center; gap: var(--s-2); }
  .iv-label { font-size: var(--fs-label); font-weight: 600; color: var(--interval-label); }
  .iv-z { font-size: 10px; padding: 0 6px; }
  .iv-meta { font-size: var(--fs-caption); color: var(--interval-sub); font-family: var(--font-num); margin-top: 3px; }
  .iv-power { flex: 0 0 auto; font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-num-md); color: var(--interval-power); }
  .iv-power-u { font-size: var(--fs-caption); color: var(--interval-power-unit); font-family: var(--font-sans); }
  .rd-curve { margin-top: var(--s-3); padding: 18px; text-align: center; border: 1px dashed var(--border-strong); border-radius: var(--r-md); background: var(--bg-sunken); color: var(--text-muted); font-size: var(--fs-caption); }

  details { margin-top: 8px; }

  /* Fase 1a — Schema plan-card (PeriodTimeline) */

  /* Fase 1b — Vorm ReadinessCard (export §2a) */
  .rc-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--card-pad); margin-bottom: var(--s-4); }

  .rc-top { display: flex; align-items: center; gap: var(--s-4); margin-top: var(--s-3); }
  .rc-ring { position: relative; flex: 0 0 auto; width: 118px; height: 118px; }
  .rc-ring-mid { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-num); font-size: var(--fs-num-lg); font-weight: var(--fw-num-lg); color: var(--text-primary); }
  .rc-side { flex: 1; min-width: 0; }
  .rc-verdict { font-size: var(--fs-h2); font-weight: var(--fw-h2); color: var(--text-primary); line-height: 1.3; }
  .rc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rc-chip { border-radius: var(--r-pill); padding: 3px 10px; font-size: var(--fs-caption); font-weight: var(--fw-caption); white-space: nowrap; }
  .rc-why { margin-top: var(--s-4); background: var(--bg-sunken); border: 1px solid var(--border-subtle); border-radius: var(--r-sm); padding: 10px 12px; }
  .rc-why > summary { list-style: none; cursor: pointer; font-size: var(--fs-label); font-weight: var(--fw-label); color: var(--text-secondary); }
  .rc-why > summary::-webkit-details-marker { display: none; }
  .rc-factors { margin-top: var(--s-3); display: flex; flex-direction: column; gap: 8px; }
  .rc-frow { display: flex; align-items: center; gap: 8px; }
  .rc-flabel { flex: 1; font-size: var(--fs-label); color: var(--text-secondary); }
  .rc-fdot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: var(--r-pill); }
  .rc-fval { flex: 0 0 auto; font-family: var(--font-num); font-size: var(--fs-num-sm); color: var(--text-primary); }
  .rc-checkin { margin-top: var(--s-4); border: 1px dashed var(--border-strong); border-radius: var(--r-sm); background: var(--bg-sunken); color: var(--text-muted); text-align: center; padding: 12px; font-size: var(--fs-label); cursor: pointer; }

  /* Fase 2 — ReadinessCard ingevuld-staat */
  .rc-done { margin-top: var(--s-4); }
  .rc-done-row { display: flex; align-items: center; gap: var(--s-3); }
  .rc-done-sum { flex: 1; font-size: var(--fs-label); color: var(--text-secondary); }
  .rc-done-add { flex: 0 0 auto; width: 32px; height: 32px; border-radius: var(--r-pill); border: none; cursor: pointer; background: var(--accent-soft); color: var(--accent); font-size: 20px; line-height: 1; }
  .rc-effect { margin-top: 8px; background: var(--accent-soft); color: var(--accent); border-radius: var(--r-sm); padding: 8px 12px; font-size: var(--fs-label); }

  /* Fase 2 — Ochtend-check-in sheet */
  .ci-title { font-size: var(--fs-h1); font-weight: var(--fw-h1); color: var(--text-primary); margin: 4px 0 var(--s-4); }
  .ci-group { margin-bottom: var(--s-4); }
  .ci-label { font-size: var(--fs-label); font-weight: var(--fw-label); color: var(--text-secondary); margin-bottom: 8px; }
  .ci-segs { display: flex; gap: 4px; background: var(--segment-track-bg); border-radius: var(--r-md); padding: 4px; }
  .ci-seg { flex: 1; border: none; cursor: pointer; background: transparent; color: var(--segment-text); font-family: var(--font-sans); font-size: var(--fs-label); font-weight: var(--fw-label); padding: 9px 4px; border-radius: var(--r-sm); text-transform: capitalize; }
  .ci-seg.is-on { background: var(--segment-active-bg); color: var(--segment-active-text); box-shadow: var(--segment-active-shadow); }
  .ci-save { width: 100%; height: var(--btn-height); margin-top: var(--s-2); border: none; cursor: pointer; border-radius: var(--btn-radius); background: var(--btn-primary-bg); color: var(--btn-primary-text); font-family: var(--font-sans); font-size: var(--fs-body); font-weight: 600; }
  .ci-save:disabled { background: var(--btn-disabled-bg); color: var(--btn-disabled-text); cursor: default; }
  .ci-later { width: 100%; margin-top: var(--s-2); padding: 10px; border: none; cursor: pointer; border-radius: var(--btn-radius); background: transparent; color: var(--text-muted); font-family: var(--font-sans); font-size: var(--fs-label); }

  /* Vorm status-graphic — swipeable deck */
  .status-wrap {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .status-wrap::-webkit-scrollbar { display: none; }
  .status-card { flex: 0 0 100%; scroll-snap-align: center; display: flex; gap: 12px; }
  .status-dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; margin-bottom: var(--s-4); }
  .status-dots .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); }

  .niveau-block { flex: 1; background: var(--card); border-radius: 16px; padding: 18px; box-shadow: 0 2px 10px rgba(15,23,42,0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .niveau-getal { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1; }
  .niveau-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 6px; }
  .niveau-wkg { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .niveau-voortgang { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.2; }
  .niveau-progressie { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.2; }

  /* v2b-A actie-knoppen */
  .act-row { display: flex; gap: var(--s-3); margin-bottom: 8px; }
  .act-btn { flex: 1; height: var(--btn-height); border: none; border-radius: var(--btn-radius); background: var(--btn-primary-bg); color: var(--btn-primary-text); font-weight: 600; font-size: var(--fs-label); cursor: pointer; font-family: var(--font-sans); }
  .act-btn-2 { background: var(--btn-secondary-bg); border: 1px solid var(--btn-secondary-border); color: var(--btn-secondary-text); }
  .act-btn:disabled { opacity: .6; cursor: default; }
  .act-status { font-size: var(--fs-label); color: var(--text-muted); margin-bottom: 12px; min-height: 16px; }

  /* beschikbaarheid-editor (overlay-sheet): open-knop + scope-segment + DayControls */
  .avail-open { width: 100%; height: var(--btn-height); margin-top: var(--s-7); border: 1px solid var(--btn-secondary-border); border-radius: var(--btn-radius); background: var(--btn-secondary-bg); color: var(--btn-secondary-text); font-weight: 600; font-size: var(--fs-label); cursor: pointer; }
  .av-title { font-size: var(--fs-h3); font-weight: var(--fw-h3); color: var(--text-primary); margin-bottom: var(--s-4); }

  .av-seg-btn { flex: 1; border: 0; background: transparent; color: var(--segment-text); font-size: var(--fs-label); font-weight: 600; padding: 9px 6px; border-radius: 8px; cursor: pointer; }
  .av-seg-btn.is-on { background: var(--segment-active-bg); color: var(--segment-active-text); box-shadow: var(--segment-active-shadow); }
  .av-body { display: flex; flex-direction: column; gap: var(--s-4); }
  .av-day { display: flex; flex-direction: column; gap: var(--s-3); padding: 12px; background: var(--bg-sunken); border-radius: var(--card-radius); }
  .av-dayname { font-size: var(--fs-label); font-weight: 600; color: var(--text-secondary); text-transform: capitalize; }
  .av-ctl { display: flex; align-items: center; justify-content: space-between; }
  .av-ctl-lbl { font-size: var(--fs-h3); color: var(--text-primary); }
  .av-min { display: flex; align-items: center; gap: var(--s-3); }
  .av-minval { width: 62px; text-align: right; font-size: var(--fs-label); color: var(--text-secondary); font-family: var(--font-num); }
  .av-save { margin-top: var(--s-4); width: 100%; height: var(--btn-height); border: none; border-radius: var(--btn-radius); background: var(--btn-primary-bg); color: var(--btn-primary-text); font-weight: 600; cursor: pointer; }
  .av-save:disabled { opacity: .6; cursor: default; }
  .av-cancel { margin-top: 8px; width: 100%; height: var(--btn-height); border: none; border-radius: var(--btn-radius); background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; }
  /* Toggle-switch (--toggle-*) */
  .tgl { position: relative; display: inline-block; width: var(--toggle-w); height: var(--toggle-h); flex: none; }
  .tgl input { position: absolute; opacity: 0; width: 0; height: 0; }
  .tgl-track { position: absolute; inset: 0; background: var(--toggle-track-off); border-radius: 999px; transition: background .15s; }
  .tgl input:checked + .tgl-track { background: var(--toggle-track-on); }
  .tgl-thumb { position: absolute; top: 50%; left: 3px; width: calc(var(--toggle-h) - 6px); height: calc(var(--toggle-h) - 6px); transform: translateY(-50%); background: var(--toggle-thumb); border-radius: 50%; box-shadow: var(--toggle-thumb-shadow); transition: left .15s; }
  .tgl input:checked ~ .tgl-thumb { left: calc(var(--toggle-w) - var(--toggle-h) + 3px); }
  /* Range-slider (--slider-*) */
  .av-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: var(--slider-track); outline: none; }
  .av-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: none; }
  .av-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--slider-thumb); cursor: pointer; border: none; }
  .av-slider::-moz-range-progress { background: var(--slider-fill); height: 4px; border-radius: 999px; }
  /* Instellingen-drawer (Fase 1) */
  .set-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--s-4); }
  .set-title { font-size: var(--fs-h1); font-weight: var(--fw-h1); color: var(--text-primary); }
  .set-close { background: none; border: none; color: var(--text-muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .set-sec { font-size: var(--fs-caption); font-weight: var(--fw-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); margin: var(--s-5) 0 var(--s-2); }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: 9px 0; border-bottom: 1px solid var(--border-subtle); }
  .set-lbl { font-size: var(--fs-label); color: var(--text-secondary); }
  .set-ro { font-size: var(--fs-label); color: var(--text-primary); font-family: var(--font-num); }
  .set-ctl { display: flex; align-items: center; gap: 6px; }
  .set-unit { font-size: var(--fs-caption); color: var(--text-muted); }
  .set-input { width: 96px; height: var(--field-height); background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--field-radius); color: var(--field-text); font-family: var(--font-num); font-size: var(--fs-label); text-align: right; padding: 0 var(--field-pad-x); }
  .set-input:focus { border-color: var(--field-border-focus); outline: none; }
  .set-date { width: 150px; text-align: left; font-family: var(--font-sans); }
  .set-select { height: var(--field-height); background: var(--select-bg); border: 1px solid var(--select-border); border-radius: var(--field-radius); color: var(--select-text); font-family: var(--font-sans); font-size: var(--fs-label); padding: 0 8px; }
  .set-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); margin: var(--s-2) 0 var(--s-1); }
  .set-tile { padding: 12px; border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-elevated); color: var(--text-secondary); font-size: var(--fs-label); font-weight: 600; cursor: pointer; }
  .set-tile.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .set-badge { font-size: var(--fs-caption); font-weight: var(--fw-caption); padding: 3px 10px; border-radius: var(--r-pill); background: var(--bg-elevated); color: var(--text-muted); }
  .set-badge.is-on { background: var(--badge-good-bg); color: var(--badge-good-text); }
  .set-save { margin-top: var(--s-5); width: 100%; height: var(--btn-height); border: none; border-radius: var(--btn-radius); background: var(--btn-primary-bg); color: var(--btn-primary-text); font-weight: 600; cursor: pointer; }
  .set-save:disabled { opacity: .6; cursor: default; }
  /* Events-sectie (Fase 2) */
  .ev-row { border-bottom: 1px solid var(--border-subtle); padding: 10px 0; }
  .ev-top { display: flex; align-items: center; gap: var(--s-2); }
  .ev-naam { flex: 1; min-width: 0; height: var(--field-height); background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--field-radius); color: var(--field-text); font-family: var(--font-sans); font-size: var(--fs-label); padding: 0 var(--field-pad-x); }
  .ev-naam:focus { border-color: var(--field-border-focus); outline: none; }
  .ev-del { flex: 0 0 auto; background: none; border: none; color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 4px 8px; }
  .ev-bot { display: flex; align-items: center; gap: var(--s-2); margin-top: 8px; }
  .ev-prio { flex: 0 0 auto; min-width: 34px; border: none; border-radius: var(--r-pill); padding: 5px 12px; font-family: var(--font-num); font-weight: var(--fw-caption); font-size: var(--fs-label); cursor: pointer; }
  .ev-prio-a { background: var(--event-a-bg); color: var(--event-a-text); }
  .ev-prio-b { background: var(--event-b-bg); color: var(--event-b-text); }
  .ev-prio-c { background: var(--bg-elevated); color: var(--text-muted); }
  .ev-date { flex: 1; min-width: 0; height: var(--field-height); background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--field-radius); color: var(--field-text); font-family: var(--font-sans); font-size: var(--fs-label); padding: 0 var(--field-pad-x); }
  .ev-empty { font-size: var(--fs-label); color: var(--text-muted); padding: 8px 0; }
  .ev-add { margin-top: var(--s-3); width: 100%; height: var(--btn-height); border: 1px dashed var(--border-strong); border-radius: var(--btn-radius); background: var(--bg-sunken); color: var(--text-secondary); font-weight: 600; font-size: var(--fs-label); cursor: pointer; }
  /* Event-details uitklap */
  .ev-details { margin-top: 8px; }
  .ev-details > summary { list-style: none; cursor: pointer; font-size: var(--fs-caption); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .ev-details > summary::-webkit-details-marker { display: none; }
  .ev-chev { transition: transform 200ms ease; }
  .ev-details[open] .ev-chev { transform: rotate(180deg); }
  .ev-det { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .ev-det-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
  .ev-det-lbl { flex: 0 0 auto; font-size: var(--fs-label); color: var(--text-secondary); }
  .ev-det-ctl { display: flex; align-items: center; gap: 6px; }
  .ev-unit { font-size: var(--fs-caption); color: var(--text-muted); }
  .ev-seg { display: flex; gap: 3px; background: var(--segment-track-bg); border-radius: 10px; padding: 3px; }
  .ev-seg-btn { border: 0; background: transparent; color: var(--segment-text); font-size: var(--fs-label); font-weight: 600; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .ev-seg-btn.is-on { background: var(--segment-active-bg); color: var(--segment-active-text); box-shadow: var(--segment-active-shadow); }
  .ev-note { flex: 1; min-width: 0; height: var(--field-height); background: var(--field-bg); border: 1px solid var(--field-border); border-radius: var(--field-radius); color: var(--field-text); font-family: var(--font-sans); font-size: var(--fs-label); padding: 0 var(--field-pad-x); }
  .ev-note:focus { border-color: var(--field-border-focus); outline: none; }
  .status-left, .status-right {
    flex: 1; background: var(--card); border-radius: 16px; padding: 14px;
    box-shadow: 0 2px 10px rgba(15,23,42,0.08); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .ring-wrap { position: relative; width: 110px; height: 110px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-mid {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .ring-mid .big { font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; }
  .ring-mid .lbl { font-size: 11px; color: var(--muted); }
  .ring-sub { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .fase-pill { margin-top: 8px; padding: 3px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; }

  .status-right { position: relative; }
  .status-word { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .status-verdict { font-size: 12px; color: var(--muted); }
  .status-i {
    position: absolute; top: 10px; right: 12px; width: 22px; height: 22px;
    border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted);
    font-size: 13px; font-weight: 700; line-height: 20px; cursor: pointer;
  }
  .st-bouwt   { color: #047857; } .st-bouwt-bg   { background: #d1fae5; }
  .st-fris    { color: #047857; } .st-fris-bg    { background: #d1fae5; }
  .st-onderh  { color: #475569; } .st-onderh-bg  { background: #e2e8f0; }
  .st-teveel  { color: #92400e; } .st-teveel-bg  { background: #fef3c7; }
  .st-achter  { color: #475569; } .st-achter-bg  { background: #e5e7eb; }

  .explainer { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: var(--s-4); box-shadow: 0 2px 10px rgba(15,23,42,0.08); font-size: 14px; color: #334155; line-height: 1.45; }
  .section-kop { font-size: var(--fs-label); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 6px 2px 10px; }

  .chart { width: 100%; height: 240px; }

    flex: 1; padding: 8px; border: none; border-radius: 10px; background: #e2e8f0;
    color: var(--muted); font-weight: 600; cursor: pointer;
  }

  /* ── Niveau-tab (Fase 7, v1) — vermogen-snapshot + progressie ── */
  .nv-snap-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nv-tier-chip { display: inline-flex; align-items: center; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--tier-step-border-active); border-radius: var(--r-pill); padding: 3px 10px; font-family: var(--font-sans); font-size: var(--fs-label); font-weight: 600; }
  .nv-snap-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 10px 0 14px; }
  .nv-ftp-num { font-family: var(--font-num); font-size: 48px; font-weight: var(--fw-num-md); color: var(--text-primary); line-height: 1; }
  .nv-ftp-unit { font-size: 18px; color: var(--text-secondary); margin-left: 3px; }
  .nv-ftp-lbl { font-family: var(--font-sans); font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--text-muted); margin-top: 4px; }
  .nv-wkg-pill { text-align: right; background: var(--wkg-emphasis-bg); border: 1px solid var(--tier-step-border-active); border-radius: var(--r-md); padding: 9px 13px; }
  .nv-wkg-over { font-family: var(--font-sans); font-size: var(--fs-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--wkg-emphasis); }
  .nv-wkg-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 4px; }
  .nv-wkg-num { font-family: var(--font-num); font-size: 30px; font-weight: 600; color: var(--wkg-emphasis); line-height: 1.1; }
  .nv-wkg-unit { font-family: var(--font-sans); font-size: 12px; font-weight: 600; color: var(--wkg-emphasis); }
  .nv-wkg-kg { font-family: var(--font-sans); font-size: var(--fs-label); color: var(--text-secondary); margin-top: 2px; }
  .nv-ladder { display: flex; gap: 4px; margin-top: 4px; }
  .nv-rung { flex: 1; height: 6px; border-radius: 999px; }
  .nv-ladder-lbls { display: flex; justify-content: space-between; margin-top: 5px; }
  .nv-ladder-lbls span { font-family: var(--font-sans); font-size: 9.5px; color: var(--tier-label); }
  .nv-prog-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .nv-ctl-toggle { border: none; background: none; cursor: pointer; padding: 0; font-family: var(--font-sans); font-size: var(--fs-label); font-weight: 600; color: var(--text-muted); }
