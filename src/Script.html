<script>
  var state = null;
  var selectedDate = null;
  var chartsReady = false;
  var checkinSel = { slaap: 'oké', benen: 'oké', stress: 'normaal' };  // Fase 2 — neutrale default
  var checkinAutoOpened = false;

  // NL-decimaal helper.
  function nl(n, dec) {
    if (n == null || n === '') return '–';
    var x = (dec != null) ? Number(n).toFixed(dec) : String(n);
    return x.replace('.', ',');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }
  function uMin(m) { m = Math.round(m || 0); return Math.floor(m / 60) + 'u ' + (m % 60) + 'm'; }

  // Resolveer een CSS-kleurexpressie (var()/color-mix) → concrete rgb-string.
  // Google Charts kent geen CSS custom properties, dus tokeniseren we via een
  // probe-element dat de cascade resolvet op draw-tijd.
  function cssColor_(expr) {
    var p = document.createElement('span');
    p.style.cssText = 'color:' + expr + ';position:absolute;left:-9999px';
    document.body.appendChild(p);
    var c = getComputedStyle(p).color;
    document.body.removeChild(p);
    return c || expr;
  }

  // ── Boot ──
  function loadState() {
    google.script.run
      .withSuccessHandler(onState)
      .withFailureHandler(showError)
      .getDashboardState();
  }
  function boot() { loadState(); }
  function showError(err) {
    document.getElementById('loading').style.display = 'none';
    var e = document.getElementById('error');
    e.style.display = 'block';
    e.textContent = '⚠️ Kon dashboard niet laden: ' + (err && err.message ? err.message : err);
  }
  function onState(s) {
    state = s;
    selectedDate = s.vandaag ? s.vandaag.dateISO : null;
    // Fase 2 — pre-select check-in-sheet uit opgeslagen waarden (heropenen toont ze).
    if (s.readiness && s.readiness.checkin) {
      checkinSel = { slaap: s.readiness.checkin.slaap, benen: s.readiness.checkin.benen, stress: s.readiness.checkin.stress };
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('bottomnav').style.display = 'flex';
    renderSchema();
    renderWeekLoad();
    renderVorm();
    renderBeschikbaarheid();
    switchTab('schema');
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(function () { chartsReady = true; drawNiveauChart(); });
    maybeAutoOpenCheckin();
  }

  // ── Zone-bar SVG — schaalt ALTIJD naar 100% breedte; kleuren via zone-tokens
  //    (bucket → --zone-1…6) i.p.v. de server-hex. mini = compacte variant.
  var ZONE_VAR = { rust: '--zone-1', z2: '--zone-2', low: '--zone-2', tempo: '--zone-3',
                   high: '--zone-4', drempel: '--zone-4', anaeroob: '--zone-6', anaerobic: '--zone-6' };
  function zoneBar(segmenten, mini) {
    if (!segmenten || !segmenten.length) return '<div class="muted">Geen structuur beschikbaar.</div>';
    var W = 100, H = 100, MINW = 1.4;
    var totMin = segmenten.reduce(function (a, b) { return a + b.minuten; }, 0) || 1;
    var raw = segmenten.map(function (sg) { return Math.max(MINW, (sg.minuten / totMin) * W); });
    var sum = raw.reduce(function (a, b) { return a + b; }, 0) || 1;
    var x = 0, parts = '';
    segmenten.forEach(function (sg, i) {
      var w = (raw[i] / sum) * W;           // renormaliseer naar exact 100
      var hh = sg.hoogtePct, y = H - hh;
      var col = 'var(' + (ZONE_VAR[sg.bucket] || '--zone-2') + ')';
      parts += '<rect x="' + x.toFixed(2) + '" y="' + y + '" width="' + w.toFixed(2) + '" height="' + hh + '" style="fill:' + col + '" rx="0.6"></rect>';
      x += w;
    });
    return '<svg class="' + (mini ? 'wk-minibar' : 'wk-zonebar') + '" viewBox="0 0 100 100" preserveAspectRatio="none">' + parts + '</svg>';
  }

  function wkMetric_(val, lbl) {
    return '<div class="wk-metric"><div class="wk-mv">' + val + '</div><div class="wk-ml">' + lbl + '</div></div>';
  }
  function wkWhy_(v) {
    if (!v.waarom || !v.waarom.length) return '';
    var li = v.waarom.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('');
    return '<details class="wk-why"><summary>Waarom deze training?</summary><ul>' + li + '</ul></details>';
  }

  // Skin §1d — workout-kaart. opts {overline, today}. Meerdere sessies → sunken sub-kaarten.
  function voorstelKaart(v, opts) {
    if (!v) return '';
    opts = opts || {};
    var ol = '<div class="wk-overline' + (opts.today ? ' wk-today' : '') + '">' + esc(opts.overline || 'Voorstel') + '</div>';
    var name = '<div class="wk-name">' + esc(v.titel) + '</div>';
    if (v.sessies && v.sessies.length > 1) {
      var subs = v.sessies.map(function (s) {
        return '<div class="wk-sub">' +
          '<div class="wk-sub-name">' + esc(s.titel || 'Sessie') + '</div>' +
          zoneBar(s.segmenten, true) +
          '<div class="wk-metrics">' + wkMetric_(uMin(s.duurMin), 'duur') + wkMetric_(Math.round(s.tss || 0), 'TSS') + '</div>' +
          (s.eindopmerking ? '<div class="wk-note">' + esc(s.eindopmerking) + '</div>' : '') +
        '</div>';
      }).join('');
      return '<div class="wk-card">' + ol + name + subs + wkWhy_(v) + '</div>';
    }
    return '<div class="wk-card">' + ol + name + zoneBar(v.segmenten) +
      '<div class="wk-metrics">' + wkMetric_(uMin(v.duurMin), 'duur') + wkMetric_(Math.round(v.tss || 0), 'TSS') + '</div>' +
      (v.reden ? '<div class="wk-note">' + esc(v.reden) + '</div>' : '') +
      wkWhy_(v) + '</div>';
  }

  // Fase 3c-A — RpeRating 1–10 (web-write). current = opgeslagen rpe of null.
  function rpeRatingHtml_(dateISO, current) {
    var btns = '';
    for (var i = 1; i <= 10; i++) {
      btns += '<button type="button" class="rpe-btn' + (current === i ? ' is-on' : '') +
        '" onclick="setRpe(\'' + dateISO + '\',' + i + ')">' + i + '</button>';
    }
    return '<div class="rpe-rate"><div class="rpe-label">RPE — hoe zwaar voelde het?</div>' +
      '<div class="rpe-row">' + btns + '</div></div>';
  }
  function actualKaart(a, dateISO) {
    if (!a) return '';
    var h = '<div class="wk-card">' +
      '<div class="wk-overline wk-ok">✓ Voltooid</div>' +
      '<div class="wk-name">' + esc(a.naam) + '</div>' +
      '<div class="wk-metrics">' +
        wkMetric_(uMin(a.duurMin), 'duur') +
        wkMetric_(a.tss != null ? Math.round(a.tss) : '–', 'TSS') +
        wkMetric_(a.rpe != null ? a.rpe : '–', 'RPE') +
      '</div>' +
      (dateISO ? rpeRatingHtml_(dateISO, a.rpe) : '');
    if (a.rpe != null && a.mismatch != null && a.rpeVerwacht != null) {
      var t = a.mismatch > 0 ? ('Zwaarder dan verwacht (+' + nl(a.mismatch, 1) + ' vs ~' + a.rpeVerwacht + ')')
            : (a.mismatch < 0 ? ('Lichter dan verwacht (' + nl(a.mismatch, 1) + ' vs ~' + a.rpeVerwacht + ')')
            : 'Precies op verwachting');
      h += '<div class="rpe-feedback">' + t + '</div>';
    }
    h += '</div>';
    return h;
  }

  // ── Fase 3c-B — skip-dispositie ──
  var DISP_LABEL = { geen_tijd: 'Geen tijd', bewust_gerust: 'Bewust gerust', iets_anders: 'Iets anders gedaan' };
  function canDispose_(d) {
    return d && d.voorstel && !d.actual && !d.dispositie && d.status !== 'rust' &&
           state.vandaag && d.dateISO <= state.vandaag.dateISO;
  }
  function dispositieAffordanceHtml_(dateISO) {
    var btns = Object.keys(DISP_LABEL).map(function (r) {
      return '<button type="button" class="disp-btn" onclick="setDisposition(\'' + dateISO + '\',\'' + r + '\')">' + DISP_LABEL[r] + '</button>';
    }).join('');
    return '<div class="disp-afford"><div class="disp-q">Niet gedaan?</div><div class="disp-row">' + btns + '</div></div>';
  }
  function gemistKaart_(d) {
    var reason = (d.dispositie && d.dispositie.reason) ? (DISP_LABEL[d.dispositie.reason] || d.dispositie.reason) : '';
    return '<div class="gemist-card">' +
      '<div class="gemist-txt">Gemist' + (reason ? ' · ' + esc(reason) : '') + '</div>' +
      '<button type="button" class="gemist-back" onclick="setDisposition(\'' + d.dateISO + '\',null)">Terug</button>' +
    '</div>';
  }
  function setRpe(dateISO, rpe) {
    google.script.run.withSuccessHandler(function (s) { state = s; renderSchema(); }).withFailureHandler(showError).saveRpe(dateISO, rpe);
  }
  function setDisposition(dateISO, reason) {
    google.script.run.withSuccessHandler(function (s) { state = s; renderSchema(); renderWeekLoad(); }).withFailureHandler(showError).saveDisposition(dateISO, reason);
  }

  // ── Schema (Vandaag + Kalender samengevoegd) ──
  // Fase 1a — Schema plan-card (PeriodTimeline). Collapsed by default (<details>).
  function planCardHtml(plan) {
    if (!plan) return '';
    var titel = plan.currentPhaseLabel || plan.currentPhaseKey || 'Plan';
    var titleHtml;
    if (plan.eventName && plan.wekenTot != null) {
      titleHtml = esc(titel) + ' · nog <span class="pc-num">' + plan.wekenTot + '</span> wkn tot ' + esc(plan.eventName);
    } else if (plan.eventName) {
      titleHtml = esc(titel) + ' · ' + esc(plan.eventName);
    } else {
      titleHtml = esc(titel) + ' · geen A-event gepland';
    }
    var seg = (plan.phases || []).map(function (p) {
      var bg = p.state === 'past' ? 'var(--phase-past)' : (p.state === 'current' ? 'var(--phase-current)' : 'var(--phase-future)');
      var lbl = p.state === 'current' ? 'var(--phase-label-current)' : 'var(--phase-label)';
      var mark = p.state === 'current' ? '<span class="pc-marker"></span>' : '';
      return '<div class="pc-seg" style="background:' + bg + '">' + mark +
        '<span class="pc-seg-lbl" style="color:' + lbl + '">' + esc(p.label) + '</span></div>';
    }).join('');
    var evs = (plan.events || []).map(function (e) {
      var bgv = e.prio === 'A' ? 'var(--event-a-bg)' : 'var(--event-b-bg)';
      var txv = e.prio === 'A' ? 'var(--event-a-text)' : 'var(--event-b-text)';
      return '<span class="pc-event" style="background:' + bgv + ';color:' + txv + '">' +
        esc(e.naam) + ' · <span class="pc-num">' + e.dagenTot + '</span>d</span>';
    }).join('');
    var stats = '<div class="pc-stat"><div class="pc-stat-lbl">Fase</div><div class="pc-stat-val">' + esc(titel) + '</div></div>';
    if (plan.eventName && plan.dagenTot != null) {
      stats += '<div class="pc-stat"><div class="pc-stat-lbl">Tot ' + esc(plan.eventName) + '</div><div class="pc-stat-val"><span class="pc-num">' + plan.dagenTot + '</span> d</div></div>';
    }
    if (plan.volume) {
      stats += '<div class="pc-stat"><div class="pc-stat-lbl">' + esc(plan.volume.label) + '</div><div class="pc-stat-val">' + esc(plan.volume.value) + '</div></div>';
    }
    return '<details class="plan-card">' +
      '<summary class="pc-head">' +
        '<div class="pc-head-main">' +
          '<div class="pc-overline">Plan · Periodisering</div>' +
          '<div class="pc-title">' + titleHtml + '</div>' +
        '</div>' +
        '<span class="pc-chip">' + esc(plan.modeLabel || '') + '</span>' +
        '<span class="pc-chevron" aria-hidden="true">⌄</span>' +
      '</summary>' +
      '<div class="pc-body">' +
        '<div class="pc-timeline">' + seg + '</div>' +
        (evs ? '<div class="pc-events">' + evs + '</div>' : '') +
        '<div class="pc-stats">' + stats + '</div>' +
      '</div>' +
    '</details>';
  }

  // ── Fase 3b — WeekLoad-kaart (deze week: gepland vs gedaan) ──
  function wlStat_(val, lbl) {
    return '<div class="wl-stat"><div class="wl-sv">' + val + '</div><div class="wl-sl">' + lbl + '</div></div>';
  }
  function renderWeekLoad(iconState) {
    var el = document.getElementById('week-load');
    if (!el) return;
    var w = state.weekLoad;
    if (!w) { el.innerHTML = ''; return; }
    iconState = iconState || 'idle';
    var icon = (iconState === 'busy') ? '<span class="wl-spin"></span>'
             : (iconState === 'done') ? '<span class="wl-check">✓</span>'
             : '↻';
    var pct = (w.progressPct != null) ? w.progressPct : 0;
    el.innerHTML = '<div class="wl-card">' +
      '<div class="wl-head">' +
        '<div class="wl-overline">Deze week</div>' +
        '<button type="button" class="wl-refresh"' + (iconState === 'busy' ? ' disabled' : '') +
          ' onclick="refreshWeekLoad()" aria-label="Ververs deze week">' + icon + '</button>' +
      '</div>' +
      '<div class="wl-stats">' + wlStat_(Math.round(w.tss), 'TSS') + wlStat_(nl(w.uren, 1), 'uren') + wlStat_(w.dagen, 'dagen') + '</div>' +
      '<div class="wl-bar"><div class="wl-bar-fill" style="width:' + pct + '%"></div></div>' +
      (w.stale ? '<div class="wl-stale">Plan verouderd</div>' : '') +
    '</div>';
  }
  function refreshWeekLoad() {
    renderWeekLoad('busy');
    google.script.run
      .withSuccessHandler(function (s) {
        state = s;
        renderSchema();               // plan/dagstrip/dag-detail volgen de verse actuals
        renderWeekLoad('done');
        setTimeout(function () { renderWeekLoad('idle'); }, 1400);
      })
      .withFailureHandler(function (err) { renderWeekLoad('idle'); showError(err); })
      .refreshWeek();
  }

  function renderSchema() {
    var vd = state.vandaag;
    document.getElementById('schema-datum').textContent = vd ? (vd.weekdag + ' · ' + vd.dateISO) : '';
    // Status-graphic bovenaan.
    document.getElementById('schema-status').innerHTML = state.plan ? planCardHtml(state.plan) : '';

    var strip = '';
    (state.dagen || []).forEach(function (d) {
      var mark = '';
      if (d.status === 'voltooid') mark = '✓';
      else if (d.status === 'vandaag') mark = '●';
      else if (d.status === 'gemist') mark = '<span style="color:var(--text-muted)">×</span>';
      else if (d.status === 'rust') mark = '·';
      else if (d.status === 'preview') mark = '~';
      var dot = d.kleur ? '<div class="dot" style="background:' + d.kleur + '"></div>' : '<div class="dot" style="background:transparent"></div>';
      var sel = (d.dateISO === selectedDate) ? ' sel' : '';
      var wd = d.weekdag.slice(0, 2);
      strip += '<div class="chip' + sel + '" data-date="' + d.dateISO + '" onclick="selectDay(\'' + d.dateISO + '\')">' +
        '<div class="cw">' + wd + '</div>' +
        '<div class="cd">' + d.kort.replace(/^.. /, '') + '</div>' +
        dot + '<div class="mark">' + mark + '</div></div>';
    });
    document.getElementById('dag-strip').innerHTML = strip;
    renderDagDetail();
    setTimeout(scrollSelectedChip, 30);  // vandaag in beeld
  }

  function selectDay(dISO) {
    selectedDate = dISO;
    document.querySelectorAll('.chip').forEach(function (c) {
      c.classList.toggle('sel', c.getAttribute('data-date') === dISO);
    });
    renderDagDetail();
  }

  // ── v2b-A: regenerate + push ──
  function regenWeek() {
    var b = document.getElementById('btn-regen');
    if (b) { b.disabled = true; b.textContent = 'Bezig…'; }
    setActStatus('');
    google.script.run
      .withSuccessHandler(function (s) { onState(s); resetActBtns(); setActStatus('✅ Voorstel bijgewerkt'); })
      .withFailureHandler(function (err) { showError(err); resetActBtns(); })
      .regenerateWeb();
  }
  function pushGarmin() {
    var b = document.getElementById('btn-push');
    if (b) { b.disabled = true; b.textContent = 'Bezig…'; }
    setActStatus('');
    google.script.run
      .withSuccessHandler(onPushResult)
      .withFailureHandler(function (err) { showError(err); resetActBtns(); })
      .pushWeb();
  }
  function onPushResult(res) {
    res = res || {};
    if (res.errors && res.errors.length) setActStatus('⚠️ ' + res.errors.join(' · '));
    else if (res.pushedCount > 0) setActStatus('✅ ' + res.pushedCount + ' workouts naar Garmin gepusht');
    else setActStatus('Geen workouts om te pushen' + (res.skipped && res.skipped.length ? ' (' + res.skipped.length + ' overgeslagen)' : ''));
    resetActBtns();
  }
  function setActStatus(t) { var e = document.getElementById('act-status'); if (e) e.textContent = t; }
  function resetActBtns() {
    var r = document.getElementById('btn-regen'); if (r) { r.disabled = false; r.textContent = 'Regenereer voorstel'; }
    var p = document.getElementById('btn-push'); if (p) { p.disabled = false; p.textContent = 'Push naar Garmin'; }
  }

  // ── v2a: beschikbaarheid-editor (write-pad) ──
  function renderBeschikbaarheid() {
    var av = state.availability || [];
    var rows = av.map(function (d, i) {
      var pendelOn = (d.dagtype === 'pendel');   // geen los pendel-veld → afgeleid uit bestaande dagtype
      return '<div class="avail-row" data-idx="' + i + '">' +
        '<label class="avail-dag"><input type="checkbox" data-av="train" data-idx="' + i + '"' + (d.train ? ' checked' : '') + ' onchange="availRowSync(' + i + ')"> ' + esc(d.dagLabel) + '</label>' +
        '<label class="avail-pendel"><input type="checkbox" data-av="pendel" data-idx="' + i + '"' + (pendelOn ? ' checked' : '') + '> Pendel? <span class="muted">woon-werk meegeteld</span></label>' +
        '<span class="avail-min-wrap" data-idx="' + i + '">' +
          '<input type="range" class="avail-min" data-av="min" data-idx="' + i + '" min="0" max="600" step="5" value="' + (d.minuten || 0) + '" oninput="availMinSync(' + i + ')">' +
          '<span class="avail-min-val" data-idx="' + i + '">' + (d.minuten || 0) + ' min</span>' +
        '</span>' +
        '<span class="avail-rust" data-idx="' + i + '">rustdag — herstel telt mee</span>' +
        '</div>';
    }).join('');
    document.getElementById('avail-rows').innerHTML = rows;
    for (var j = 0; j < av.length; j++) availRowSync(j);
    var btn = document.getElementById('avail-save');
    if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
  }

  // Train aan → slider+waarde; Train uit → "rustdag" (slider blijft in DOM, save schrijft de rij wel).
  function availRowSync(i) {
    var on = document.querySelector('[data-av="train"][data-idx="' + i + '"]').checked;
    var wrap = document.querySelector('.avail-min-wrap[data-idx="' + i + '"]');
    var rust = document.querySelector('.avail-rust[data-idx="' + i + '"]');
    if (wrap) wrap.style.display = on ? 'flex' : 'none';
    if (rust) rust.style.display = on ? 'none' : 'block';
  }
  function availMinSync(i) {
    var v = document.querySelector('[data-av="min"][data-idx="' + i + '"]').value;
    var lbl = document.querySelector('.avail-min-val[data-idx="' + i + '"]');
    if (lbl) lbl.textContent = v + ' min';
  }

  function saveAvail() {
    var updates = [];
    for (var i = 0; i < 7; i++) {
      var train = !!document.querySelector('[data-av="train"][data-idx="' + i + '"]').checked;
      var minuten = Number(document.querySelector('[data-av="min"][data-idx="' + i + '"]').value) || 0;
      var pendel = !!document.querySelector('[data-av="pendel"][data-idx="' + i + '"]').checked;
      // dagtype client-afgeleid (E onafhankelijk van train); nooit 'recovery' (= engine-only).
      var dagtype = pendel ? 'pendel' : ((i === 5 || i === 6) ? 'weekend' : 'vrij');
      updates.push({ train: train, minuten: minuten, dagtype: dagtype });
    }
    var btn = document.getElementById('avail-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Opslaan…'; }
    google.script.run
      .withSuccessHandler(onState)
      .withFailureHandler(function (err) { showError(err); if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; } })
      .saveAvailability(updates);
  }

  function renderDagDetail() {
    var d = (state.dagen || []).filter(function (x) { return x.dateISO === selectedDate; })[0];
    var el = document.getElementById('dag-detail');
    if (!d) { el.innerHTML = ''; return; }
    var h = '<div class="muted" style="text-transform:capitalize;margin-bottom:6px">' + esc(d.weekdag) + ' ' + esc(d.kort) + '</div>';

    if (d.status === 'gemist') {
      h += gemistKaart_(d);
    } else if (d.status === 'vandaag') {
      // Schema = puur trainingsgericht; readiness/Garmin-verwachting leven op Vorm.
      var v = state.vandaag;
      if (v.status === 'rust') {
        h += '<div class="card"><h3>Rustdag</h3><div class="muted">Geen training gepland vandaag. Herstel is training.</div></div>';
      } else {
        if (v.voorstel) h += voorstelKaart(v.voorstel, { overline: 'Vandaag', today: true });
        if (v.actual)   h += actualKaart(v.actual, d.dateISO);
        if (!v.voorstel && !v.actual) h += '<div class="card"><div class="muted">Nog geen voorstel — draai Genereer voorstel in de Sheet.</div></div>';
        if (canDispose_(d)) h += dispositieAffordanceHtml_(d.dateISO);
      }
    } else if (d.status === 'preview') {
      h += '<div class="card"><div class="muted">Volgende week — ' +
        (d.previewMin ? '~' + d.previewMin + ' min gepland (nog niet uitgewerkt)' : 'nog niet ingepland') + '</div></div>';
    } else if (d.status === 'voltooid' && d.actual) {
      h += actualKaart(d.actual, d.dateISO);
      if (d.voorstel) h += voorstelKaart(d.voorstel, { overline: 'Gepland' });
    } else if (d.voorstel) {
      h += voorstelKaart(d.voorstel, { overline: 'Voorstel' });
      if (canDispose_(d)) h += dispositieAffordanceHtml_(d.dateISO);
    } else {
      h += '<div class="card"><div class="muted">Geen training deze dag.</div></div>';
    }
    el.innerHTML = h;
  }

  // ── Vorm: status-first ──
  var STATUS_DEF = {
    'Bouwt op':   { cls: 'st-bouwt',  bg: 'st-bouwt-bg',  verdict: 'Je bouwt fitheid op.',
      uitleg: 'Je trainingslast stijgt sneller dan je fitheid is ingehaald. In een opbouwblok precies goed: je vraagt meer dan je lijf gewend is, zo groeit vorm. Houd herstel in de gaten.' },
    'Onderhoudt': { cls: 'st-onderh', bg: 'st-onderh-bg', verdict: 'Je houdt je fitheid vast.',
      uitleg: 'Je traint genoeg om fitheid vast te houden, niet genoeg om te groeien. Prima in onderhoud of taper; suboptimaal als je wilt opbouwen.' },
    'Te veel':    { cls: 'st-teveel', bg: 'st-teveel-bg', verdict: 'Je vermoeidheid loopt voor.',
      uitleg: 'Je vermoeidheid loopt flink voor op je fitheid. Een paar dagen kan, langer is blessure-/overtraining-risico. Plan herstel in.' },
    'Achteruit':  { cls: 'st-achter', bg: 'st-achter-bg', verdict: 'Fitheid zakt langzaam weg.',
      uitleg: 'Je bent erg uitgerust — te lang weinig prikkel en fitheid zakt langzaam weg. Bouw de last weer op, tenzij dit een bewuste rustweek is.' },
    'Fris':       { cls: 'st-fris',   bg: 'st-fris-bg',   verdict: 'Uitgerust, fitheid intact.',
      uitleg: 'Je bent uitgerust met fitheid grotendeels intact. Ideaal vlak voor een belangrijke rit of event.' }
  };

  function statusVoor(v) {
    if (!v.huidig) return null;
    var z = v.huidig.vormZone, ramp = v.huidig.ramp, rb = v.rampBuildMin != null ? v.rampBuildMin : 3;
    if (z === 'Hoog risico') return 'Te veel';
    if (z === 'Overgang')    return 'Achteruit';
    if (z === 'Fris')        return 'Fris';
    // Optimaal / Grijze zone
    return (ramp != null && ramp >= rb) ? 'Bouwt op' : 'Onderhoudt';
  }

  function ringSvg(dagenTot) {
    var r = 42, C = 2 * Math.PI * r;
    var frac = (dagenTot == null) ? 0 : Math.max(0, Math.min(1, 1 - dagenTot / 90));
    var fill = frac * C;
    return '<svg width="110" height="110" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:var(--ring-track)" stroke-width="9"></circle>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:var(--accent)" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + fill.toFixed(1) + ' ' + (C - fill).toFixed(1) + '"></circle></svg>';
  }

  // Gedeelde status-graphic (Vorm-tab + Vandaag). sfx = unieke suffix zodat
  // de "i"-uitleg per mount eigen id heeft (geen duplicate-id-conflict).
  function statusGraphicHtml(sfx) {
    var v = state.vorm, ev = v.event || {};
    var st = statusVoor(v);
    var def = st ? STATUS_DEF[st] : null;
    var dagen = ev.dagenTot;
    var ringMid = (dagen != null)
      ? '<div class="big">' + dagen + '</div><div class="lbl">dagen</div>'
      : '<div class="big">–</div><div class="lbl">geen event</div>';
    var sub = (dagen != null && ev.naam) ? 'tot ' + esc(ev.naam) : 'geen event gepland';
    var left = '<div class="status-left"><div class="ring-wrap">' + ringSvg(dagen) +
      '<div class="ring-mid">' + ringMid + '</div></div>' +
      '<div class="ring-sub">' + sub + '</div>' +
      (v.macroFase ? '<div class="fase-pill">' + esc(v.macroFase) + '</div>' : '') + '</div>';
    var right;
    if (def) {
      right = '<div class="status-right ' + def.bg + '">' +
        '<div class="status-i" onclick="toggleUitleg(\'' + sfx + '\')">i</div>' +
        '<div class="status-word ' + def.cls + '">' + st + '</div>' +
        '<div class="status-verdict">' + esc(def.verdict) + '</div></div>';
    } else {
      right = '<div class="status-right"><div class="status-verdict">Geen vorm-data.</div></div>';
    }
    // KAART 2 — W/kg-ankerniveau (2a; conditie-modifier volgt in 2b).
    // niveau/wkg staan top-level op state (niet op state.vorm).
    var nivGetal = (state.niveau != null) ? nl(state.niveau, 1) : '–';
    var nivWkg = (state.wkg != null) ? nl(state.wkg, 2) + ' W/kg' : '–';
    // 2b-2 adherence-subtekst, STRIKT binnen .niveau-block na .niveau-wkg.
    // voortgangPct staat top-level op state. Null → regel weglaten (geen "–% van plan").
    var voortgang = (state.voortgangPct != null)
      ? '<div class="niveau-voortgang">' + nl(state.voortgangPct, 0) + '% van plan</div>'
      : '<div class="niveau-voortgang">blok net gestart</div>';
    // 2b-3: beginniveau→huidig delta (− blijft − via nl). Geen begin-data → weglaten.
    var progressie = (state.niveauDelta != null && state.beginLabel)
      ? '<div class="niveau-progressie">' + (state.niveauDelta >= 0 ? '+' : '') +
        nl(state.niveauDelta, 1) + ' sinds ' + esc(state.beginLabel) + '</div>' : '';
    var card2 = '<div class="status-card"><div class="niveau-block">' +
      '<div class="niveau-getal">' + nivGetal + '</div>' +
      '<div class="niveau-label">Niveau</div>' +
      '<div class="niveau-wkg">' + nivWkg + '</div>' + voortgang + progressie + '</div></div>';

    return '<div class="status-wrap" id="swrap-' + sfx + '" onscroll="syncDots(\'' + sfx + '\')">' +
      '<div class="status-card">' + left + right + '</div>' + card2 + '</div>' +
      '<div class="status-dots" id="sdots-' + sfx + '"><span class="dot active"></span><span class="dot"></span></div>' +
      '<div class="explainer" id="vorm-uitleg-' + sfx + '" style="display:none">' +
      (def ? esc(def.uitleg) : '') + '</div>';
  }

  // Dot-indicator synct met de swipe-positie van de status-deck.
  function syncDots(sfx) {
    var track = document.getElementById('swrap-' + sfx);
    var dots = document.getElementById('sdots-' + sfx);
    if (!track || !dots) return;
    var idx = Math.round(track.scrollLeft / track.clientWidth);
    for (var i = 0; i < dots.children.length; i++) {
      dots.children[i].classList.toggle('active', i === idx);
    }
  }
  // ── Fase 1b — ReadinessCard (export §2a). Vervangt de oude Vorm-deck. ──
  // Eigen ring (0-100, band-gekleurd) los van de countdown-ringSvg.
  function readinessRing_(score, colorVar) {
    var r = 42, C = 2 * Math.PI * r;
    var frac = (score == null) ? 0 : Math.max(0, Math.min(1, score / 100));
    var fill = frac * C;
    return '<div class="rc-ring">' +
      '<svg width="118" height="118" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:var(--readiness-ring-track)" stroke-width="9"></circle>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:' + colorVar + '" stroke-width="9" stroke-linecap="round" ' +
      'transform="rotate(-90 50 50)" stroke-dasharray="' + fill.toFixed(1) + ' ' + (C - fill).toFixed(1) + '"></circle></svg>' +
      '<div class="rc-ring-mid">' + (score == null ? '–' : score) + '</div></div>';
  }

  var RC_VERDICT = { ready: 'Klaar voor een harde dag', caution: 'Houd het rustig — kies behoud', rest: 'Vandaag rust aangeraden' };
  var RC_BANDVAR = { ready: 'var(--readiness-ready)', caution: 'var(--readiness-caution)', rest: 'var(--readiness-rest)' };
  var RC_DOTVAR  = { good: 'var(--good)', warn: 'var(--warn)', muted: 'var(--text-muted)' };

  function readinessCardHtml(rd) {
    if (!rd || rd.score == null) return '<div class="card muted">Readiness nog niet te berekenen.</div>';
    var band = rd.band || 'rest';
    var bandVar = RC_BANDVAR[band] || 'var(--text-muted)';

    var chips = (rd.chips || []).map(function (c) {
      return (c.tone === 'fresh')
        ? '<span class="rc-chip" style="color:var(--fresh);background:var(--fresh-soft)">' + esc(c.label) + '</span>'
        : '<span class="rc-chip" style="color:var(--text-muted)">' + esc(c.label) + '</span>';
    }).join('');

    var rows = (rd.factors || []).map(function (f) {
      var dotVar = RC_DOTVAR[f.dot] || 'var(--text-muted)';
      return '<div class="rc-frow">' +
        '<span class="rc-flabel">' + esc(f.label) + '</span>' +
        '<span class="rc-fdot" style="background:' + dotVar + '"></span>' +
        '<span class="rc-fval">' + esc(f.valueText) + ' · ' + f.weight + '%</span>' +
        '</div>';
    }).join('');

    return '<div class="rc-card">' +
      '<div class="rc-overline">Status · Vandaag</div>' +
      '<div class="rc-top">' + readinessRing_(rd.score, bandVar) +
        '<div class="rc-side">' +
          '<div class="rc-verdict">' + esc(RC_VERDICT[band] || '') + '</div>' +
          (chips ? '<div class="rc-chips">' + chips + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<details class="rc-why"><summary>Waarom dit cijfer?</summary>' +
        '<div class="rc-factors">' + rows + '</div></details>' +
      (rd.checkinDone
        ? checkinDoneHtml_(rd)
        : '<div class="rc-checkin" onclick="openCheckin()">+ Ochtend-check-in invullen</div>') +
    '</div>';
  }

  function renderVormStatus() {
    document.getElementById('vorm-status').innerHTML = readinessCardHtml(state.readiness);
  }

  // ── Fase 2 — Ochtend-check-in (bottom sheet via overlay-primitive) ──
  var CHECKIN_Q = [
    { key: 'slaap',  label: 'Slaap',  opts: ['slecht', 'oké', 'goed'] },
    { key: 'benen',  label: 'Benen',  opts: ['zwaar', 'oké', 'fris'] },
    { key: 'stress', label: 'Stress', opts: ['hoog', 'normaal', 'laag'] }
  ];
  function checkinSheetHtml() {
    var groups = CHECKIN_Q.map(function (q) {
      var segs = q.opts.map(function (o) {
        var on = (checkinSel[q.key] === o) ? ' is-on' : '';
        return '<button type="button" class="ci-seg' + on + '" data-val="' + o + '" onclick="checkinPick(\'' + q.key + '\',\'' + o + '\')">' + o + '</button>';
      }).join('');
      return '<div class="ci-group"><div class="ci-label">' + q.label + '</div>' +
        '<div class="ci-segs" data-ci-row="' + q.key + '">' + segs + '</div></div>';
    }).join('');
    return '<div class="ci-title">Ochtend-check-in</div>' + groups +
      '<button type="button" class="ci-save" onclick="submitCheckin()">Vastleggen</button>';
  }
  function openCheckin() { openDrawer({ variant: 'sheet', html: checkinSheetHtml() }); }
  function checkinPick(key, val) {
    checkinSel[key] = val;
    document.querySelectorAll('[data-ci-row="' + key + '"] .ci-seg').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-val') === val);
    });
  }
  function submitCheckin() {
    var btn = document.querySelector('.ci-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Bezig…'; }
    google.script.run
      .withSuccessHandler(function (rd) { state.readiness = rd; closeDrawer(); renderVormStatus(); })
      .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.textContent = 'Vastleggen'; } showError(err); })
      .saveCheckin(checkinSel.slaap, checkinSel.benen, checkinSel.stress);
  }
  function maybeAutoOpenCheckin() {
    if (checkinAutoOpened) return;
    if (state.readiness && state.readiness.checkinDone === false) {
      checkinAutoOpened = true;
      setTimeout(openCheckin, 400);   // na de eerste render; dismissbaar via scrim/Esc
    }
  }
  // ReadinessCard-onderkant in ingevuld-staat: samenvatting + ronde +-knop + effect-callout.
  function checkinDoneHtml_(rd) {
    var d = rd.checkinDelta || 0;
    var effect = (d === 0) ? 'Check-in: geen effect op je score'
      : 'Check-in: ' + (d > 0 ? '+' + d : d) + ' op je score';
    return '<div class="rc-done">' +
      '<div class="rc-done-row">' +
        '<span class="rc-done-sum">' + esc(rd.checkinSummary || '') + '</span>' +
        '<button type="button" class="rc-done-add" onclick="openCheckin()" aria-label="Check-in aanpassen">+</button>' +
      '</div>' +
      '<div class="rc-effect">' + esc(effect) + '</div></div>';
  }
  window.openCheckin = openCheckin;
  function toggleUitleg(sfx) {
    var el = document.getElementById('vorm-uitleg-' + sfx);
    if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
  }

  // ── Vorm: trend & details ──
  // niveauReeks-delta (laatste − eerste non-null) — ZELFDE bron als de Alles-window
  // van de niveau-grafiek (renderNiveauHead_), zodat LevelCard ↔ grafiek consistent zijn.
  function niveauReeksDelta_() {
    var reeks = (state.vorm && state.vorm.niveauReeks) ? state.vorm.niveauReeks : [];
    var pts = reeks.filter(function (p) { return p.niveau != null; });
    if (pts.length < 2) return null;
    return Math.round((pts[pts.length - 1].niveau - pts[0].niveau) * 10) / 10;
  }

  // Fase 3 deel 1+4 — LevelCard (export §2b): niveau-tier-chip + reconciled delta + blok-%.
  function levelCardHtml(s) {
    if (s.niveau == null) return '<div class="rc-card muted">Geen niveau-data.</div>';
    var max = 50;
    var pct = Math.max(0, Math.min(100, s.niveau / max * 100));
    var chip = s.niveauTier ? '<span class="lc-chip"><span class="lc-dot"></span>' + esc(s.niveauTier) + '</span>' : '';
    var wkg = (s.wkg != null) ? nl(s.wkg, 2) + ' W/kg' : '–';
    var d = niveauReeksDelta_();
    var deltaLine = (d != null && s.beginLabel)
      ? '<div class="lc-delta-line ' + (d > 0 ? 'lc-up' : (d < 0 ? 'lc-down' : '')) + '">' +
          (d >= 0 ? '+' : '') + nl(d, 1) + (d > 0 ? ' ↑' : (d < 0 ? ' ↓' : '')) + ' sinds ' + esc(s.beginLabel) + '</div>'
      : '';
    var blok = (s.voortgangPct != null)
      ? '<div class="lc-blok">' + nl(s.voortgangPct, 0) + '% van je blok behaald</div>'
      : '<div class="lc-blok muted">blok net gestart</div>';
    return '<div class="rc-card">' +
      '<div class="lc-head"><div class="rc-overline">Niveau</div>' + chip + '</div>' +
      '<div class="lc-row"><div class="lc-num">' + Math.round(s.niveau) + '<span class="lc-max">/ ' + max + '</span></div></div>' +
      '<div class="lc-wkg">' + wkg + '</div>' +
      '<div class="lc-bar"><div class="lc-bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      deltaLine + blok +
    '</div>';
  }

  // Fase 3 deel 1 — MetricRow (export §2d), op de 3a-card-skin.
  function metricRowHtml(s) {
    var ftp = (s.ftp != null) ? s.ftp : '–';
    var gew = (s.gewicht != null) ? nl(s.gewicht, 1) : '–';
    var wtss = (s.weekLoad && s.weekLoad.tss != null) ? Math.round(s.weekLoad.tss) : '–';
    return '<div class="wk-card"><div class="wk-metrics">' +
      wkMetric_(ftp, 'FTP') + wkMetric_(gew, 'gewicht') + wkMetric_(wtss, 'week-TSS') +
    '</div></div>';
  }

  function renderVorm() {
    renderVormStatus();
    document.getElementById('vorm-level').innerHTML = levelCardHtml(state);
    document.getElementById('vorm-metrics').innerHTML = metricRowHtml(state);
    document.getElementById('niveau-trend-sub').textContent =
      'W/kg-niveau per maand sinds ' + (state.beginLabel || 'start');
    renderNiveauHead_();
    renderBalans_();
  }

  // Fase 3 deel 3 — Conditie Balans-meter (3-band TSB; custom SVG-track + HTML-marker,
  // GEEN Google Charts → de translucente -soft-banden renderen correct via var()).
  var BM_BAND = {
    over: { label: 'Oververmoeid', c: 'var(--bad)',   s: 'var(--bad-soft)' },
    prod: { label: 'Productief',   c: 'var(--good)',  s: 'var(--good-soft)' },
    fris: { label: 'Fris',         c: 'var(--fresh)', s: 'var(--fresh-soft)' }
  };
  function renderBalans_() {
    var el = document.getElementById('vorm-balans');
    if (!el) return;
    var ov = '<div class="rc-overline">Conditie-balans</div><div class="bm-sub">vorm = fitheid − vermoeidheid</div>';
    var h = state.vorm && state.vorm.huidig;
    if (!h || h.vorm == null) {
      el.innerHTML = '<div class="rc-card">' + ov + '<div class="bm-empty muted">Nog te weinig data — conditie volgt zodra je traint.</div></div>';
      return;
    }
    var tsb = h.vorm, LO = -30, HI = 25;
    var pct = (Math.max(LO, Math.min(HI, tsb)) - LO) / (HI - LO) * 100;       // marker-positie, geclampt
    var key = (tsb < -10) ? 'over' : (tsb <= 5 ? 'prod' : 'fris');
    var b = BM_BAND[key];
    var valTxt = (tsb === 0) ? '±0' : (tsb > 0 ? '+' + tsb : '' + tsb);
    var p1 = (-10 - LO) / (HI - LO) * 100, p2 = (5 - LO) / (HI - LO) * 100, pz = (0 - LO) / (HI - LO) * 100;
    var track = '<svg class="bm-track" viewBox="0 0 100 10" preserveAspectRatio="none">' +
      '<rect x="0" y="0" width="' + p1.toFixed(2) + '" height="10" style="fill:var(--bad-soft)"></rect>' +
      '<rect x="' + p1.toFixed(2) + '" y="0" width="' + (p2 - p1).toFixed(2) + '" height="10" style="fill:var(--good-soft)"></rect>' +
      '<rect x="' + p2.toFixed(2) + '" y="0" width="' + (100 - p2).toFixed(2) + '" height="10" style="fill:var(--fresh-soft)"></rect>' +
      '<line x1="' + pz.toFixed(2) + '" y1="0" x2="' + pz.toFixed(2) + '" y2="10" style="stroke:var(--border-strong)" stroke-width="0.7"></line></svg>';
    el.innerHTML = '<div class="rc-card">' + ov +
      '<div class="bm-head"><div class="bm-val" style="color:' + b.c + '">' + valTxt + '</div>' +
        '<span class="bm-chip" style="color:' + b.c + ';background:' + b.s + '">' + b.label + '</span>' +
        '<span class="bm-tsb">TSB · vorm-saldo</span></div>' +
      '<div class="bm-meter">' + track + '<div class="bm-marker" style="left:' + pct.toFixed(2) + '%"></div></div>' +
      '<div class="bm-labels"><span>oververmoeid</span><span>productief</span><span>fris</span></div></div>';
  }


  // 'yyyy-MM' → "mmm 'jj" (NL maand-afkorting).
  var NL_MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  function nlMaandLabel_(yyyyMM) {
    var p = String(yyyyMM).split('-');
    var m = parseInt(p[1], 10) - 1;
    return (NL_MND[m] || '?') + " '" + p[0].slice(-2);
  }

  // Fase 3 deel 2 — niveau-trend venster-toggle (1M/6M/12M/Alles) + value/delta-header.
  // Client-display: slicet de bestaande maand-reeks (geen server-aggregatie).
  var NIVEAU_WINDOWS = [{ k: '1m', l: '1M', n: 2 }, { k: '6m', l: '6M', n: 7 }, { k: '12m', l: '12M', n: 13 }, { k: 'alles', l: 'Alles', n: null }];
  var niveauWindow = 'alles';
  function niveauReeksWindow_() {
    var reeks = (state.vorm && state.vorm.niveauReeks) ? state.vorm.niveauReeks : [];
    var w = NIVEAU_WINDOWS.filter(function (x) { return x.k === niveauWindow; })[0];
    if (!w || w.n == null) return reeks;
    return reeks.slice(Math.max(0, reeks.length - w.n));
  }
  function renderNiveauHead_() {
    var el = document.getElementById('niveau-head');
    if (!el) return;
    var full = (state.vorm && state.vorm.niveauReeks) ? state.vorm.niveauReeks : [];
    var nonNull = full.filter(function (p) { return p.niveau != null; });
    // Empty/te-kort (< 2 punten): value "—", geen toggle.
    if (nonNull.length < 2) {
      el.innerHTML = '<div class="nh-row"><div class="nh-val nh-empty">—<span class="nh-unit">niveau</span></div></div>';
      return;
    }
    var pts = niveauReeksWindow_().filter(function (p) { return p.niveau != null; });
    var cur = pts.length ? pts[pts.length - 1].niveau : null;
    var first = pts.length ? pts[0].niveau : null;
    var delta = (cur != null && first != null) ? Math.round((cur - first) * 10) / 10 : null;
    var deltaHtml = '';
    if (delta != null && pts.length > 1) {
      if (delta > 0)      deltaHtml = '<span class="nh-delta nh-up">+' + nl(delta, 1) + ' ↑</span>';
      else if (delta < 0) deltaHtml = '<span class="nh-delta nh-down">' + nl(delta, 1) + ' ↓</span>';
      else                deltaHtml = '<span class="nh-delta">±0,0</span>';
    }
    var segs = NIVEAU_WINDOWS.map(function (w) {
      return '<button type="button" data-nw="' + w.k + '"' + (w.k === niveauWindow ? ' class="active"' : '') +
        ' onclick="setNiveauWindow(\'' + w.k + '\')">' + w.l + '</button>';
    }).join('');
    el.innerHTML = '<div class="nh-row"><div class="nh-val">' + nl(cur, 1) +
      '<span class="nh-unit">niveau</span></div>' + deltaHtml + '</div>' +
      '<div class="seg">' + segs + '</div>';
  }
  function setNiveauWindow(k) {
    niveauWindow = k;
    renderNiveauHead_();
    drawNiveauChart();
  }

  // §2c: niveau-per-maand trend — AreaChart (accent-area 26% + 2,5px lijn + "nu"-punt).
  // Venster via niveauReeksWindow_; auto-zoom Y; interpolateNulls voor lege maanden.
  // Google Charts-limieten (best-effort): area is flat 26% (geen gradient-fade naar 0);
  // lijn-caps niet rond instelbaar; "nu"-punt krijgt fill maar geen stroke-ring.
  function drawNiveauChart() {
    if (!chartsReady || !state || !state.vorm || !state.vorm.niveauReeks) return;
    var el = document.getElementById('niveau-chart');
    if (!el) return;
    if (state.vorm.niveauReeks.filter(function (p) { return p.niveau != null; }).length < 2) {
      el.innerHTML = '<div class="muted">Nog te weinig niveau-data.</div>'; return;
    }
    var reeks = niveauReeksWindow_();
    var lastIdx = -1;
    reeks.forEach(function (p, i) { if (p.niveau != null) lastIdx = i; });
    var puntStyle = 'point { size: 5; fill-color: ' + cssColor_('var(--accent)') + '; }';

    var dt = new google.visualization.DataTable();
    dt.addColumn('string', 'Maand');
    dt.addColumn('number', 'Niveau');
    dt.addColumn({ type: 'string', role: 'tooltip' });
    dt.addColumn({ type: 'string', role: 'style' });
    var mn = Infinity, mx = -Infinity;
    reeks.forEach(function (p, i) {
      var tip = null;
      if (p.niveau != null) {
        tip = nlMaandLabel_(p.maand) + ': ' + p.niveau.toFixed(1).replace('.', ',');
        if (p.ftp && p.gewicht) tip += ' (' + (p.ftp / p.gewicht).toFixed(2).replace('.', ',') + ' W/kg)';
        if (p.niveau < mn) mn = p.niveau;
        if (p.niveau > mx) mx = p.niveau;
      }
      dt.addRow([nlMaandLabel_(p.maand), p.niveau, tip, (i === lastIdx) ? puntStyle : null]);
    });
    var opts = {
      legend: { position: 'none' },
      chartArea: { width: '85%', height: '70%' },
      colors: [cssColor_('var(--chart-line)')],
      curveType: 'function', interpolateNulls: true,
      lineWidth: 2.5, pointSize: 0, areaOpacity: 0.26,
      hAxis: { textStyle: { fontSize: 9, color: cssColor_('var(--text-secondary)') }, gridlines: { color: cssColor_('var(--chart-grid)') }, minorGridlines: { color: 'transparent' }, baselineColor: cssColor_('var(--chart-grid)') },
      vAxis: { textStyle: { color: cssColor_('var(--chart-axis)') }, gridlines: { color: cssColor_('var(--chart-grid)') }, minorGridlines: { color: 'transparent' }, baselineColor: cssColor_('var(--chart-grid)') },
      backgroundColor: 'transparent'
    };
    if (mn !== Infinity) opts.vAxis.viewWindow = { min: Math.floor(mn - 1), max: Math.ceil(mx + 1) };
    new google.visualization.AreaChart(el).draw(dt, opts);
  }


  // ── Navigatie ──
  function scrollSelectedChip() {
    var el = document.querySelector('.chip.sel');
    if (el) el.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function switchTab(name) {
    ['schema', 'vorm', 'trainingen', 'niveau'].forEach(function (t) {
      document.getElementById('tab-' + t).style.display = (t === name) ? 'block' : 'none';
    });
    document.querySelectorAll('#bottomnav button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === name);
    });
    if (name === 'vorm') { drawNiveauChart(); }
    // Schema opent op vandaag: scroll de geselecteerde chip in beeld zodra
    // de container zichtbaar is (scrollIntoView werkt niet op display:none).
    if (name === 'schema') setTimeout(scrollSelectedChip, 30);
  }

  // ── Reusable overlay (sheet/drawer) ──
  var drawerPrevFocus = null;
  function openDrawer(opts) {
    opts = opts || {};
    var scrim = document.getElementById('overlay-scrim');
    var panel = document.getElementById('overlay-panel');
    panel.setAttribute('data-variant', opts.variant || 'sheet');
    if (typeof opts.html === 'string') document.getElementById('overlay-content').innerHTML = opts.html;
    drawerPrevFocus = document.activeElement;
    document.body.classList.add('overlay-open');
    scrim.classList.add('is-open');
    panel.classList.add('is-open');
    panel.setAttribute('aria-hidden', 'false');
    var f = panel.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    (f || panel).focus({ preventScroll: true });
  }
  function closeDrawer() {
    document.getElementById('overlay-scrim').classList.remove('is-open');
    var panel = document.getElementById('overlay-panel');
    panel.classList.remove('is-open');
    panel.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('overlay-open');
    if (drawerPrevFocus && drawerPrevFocus.focus) drawerPrevFocus.focus();
    drawerPrevFocus = null;
  }
  window.openDrawer = openDrawer;
  window.closeDrawer = closeDrawer;

  // Fase 3 deel 4 — Vorm swipe-deck: active dot volgt de scroll-positie.
  function syncDeckDots_() {
    var deck = document.getElementById('vorm-deck');
    var dots = document.getElementById('vorm-deck-dots');
    if (!deck || !dots) return;
    var idx = Math.round(deck.scrollLeft / Math.max(1, deck.clientWidth));
    for (var i = 0; i < dots.children.length; i++) dots.children[i].classList.toggle('active', i === idx);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('#bottomnav button').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
    var vDeck = document.getElementById('vorm-deck');
    if (vDeck) vDeck.addEventListener('scroll', syncDeckDots_);
    document.querySelectorAll('#vorm-deck-dots .deck-dot').forEach(function (dot) {
      dot.addEventListener('click', function () {
        var dk = document.getElementById('vorm-deck');
        dk.scrollTo({ left: parseInt(dot.getAttribute('data-slide'), 10) * dk.clientWidth, behavior: 'smooth' });
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.getElementById('overlay-panel').classList.contains('is-open')) closeDrawer();
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-overlay-close]')) closeDrawer();
    });
    boot();
  });
</script>
