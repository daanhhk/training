<script>
  var state = null;
  var selectedDate = null;
  var statPeriod = 'd28';
  var chartsReady = false;

  // NL-decimaal helper.
  function nl(n, dec) {
    if (n == null || n === '') return '–';
    var x = (dec != null) ? Number(n).toFixed(dec) : String(n);
    return x.replace('.', ',');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }
  function uMin(m) { m = Math.round(m || 0); return Math.floor(m / 60) + 'u ' + (m % 60) + 'm'; }

  // ── Boot ──
  function loadState() {
    google.script.run
      .withSuccessHandler(onState)
      .withFailureHandler(showError)
      .getDashboardState();
  }
  function boot() { loadState(); }
  function showError(err) {
    document.getElementById('loading').style.display = 'none';
    var e = document.getElementById('error');
    e.style.display = 'block';
    e.textContent = '⚠️ Kon dashboard niet laden: ' + (err && err.message ? err.message : err);
  }
  function onState(s) {
    state = s;
    selectedDate = s.vandaag ? s.vandaag.dateISO : null;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('bottomnav').style.display = 'flex';
    renderSchema();
    renderVorm();
    renderBeschikbaarheid();
    switchTab('schema');
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(function () { chartsReady = true; drawVormChart(); drawNiveauChart(); });
  }

  // ── Zone-bar SVG — schaalt ALTIJD naar 100% breedte (viewBox 0..100,
  //    preserveAspectRatio none). Korte blokken krijgen een min-breedte,
  //    daarna renormaliseren we zodat de som exact 100 blijft (geen overflow).
  function zoneBar(segmenten) {
    if (!segmenten || !segmenten.length) return '<div class="muted">Geen structuur beschikbaar.</div>';
    var W = 100, H = 100, MINW = 1.4;
    var totMin = segmenten.reduce(function (a, b) { return a + b.minuten; }, 0) || 1;
    var raw = segmenten.map(function (sg) { return Math.max(MINW, (sg.minuten / totMin) * W); });
    var sum = raw.reduce(function (a, b) { return a + b; }, 0) || 1;
    var x = 0, parts = '';
    segmenten.forEach(function (sg, i) {
      var w = (raw[i] / sum) * W;           // renormaliseer naar exact 100
      var h = sg.hoogtePct, y = H - h;
      parts += '<rect x="' + x.toFixed(2) + '" y="' + y + '" width="' + w.toFixed(2) + '" height="' + h + '" fill="' + sg.kleur + '" rx="0.6"></rect>';
      x += w;
    });
    return '<svg class="zonebar" viewBox="0 0 100 100" preserveAspectRatio="none">' + parts + '</svg>';
  }

  function voorstelKaart(v) {
    if (!v) return '';
    var h = '<div class="card"><h3>' + esc(v.titel) + '</h3>';
    h += zoneBar(v.segmenten);
    h += '<div class="metrics">';
    h += '<div class="metric"><div class="v">' + uMin(v.duurMin) + '</div><div class="l">duur</div></div>';
    h += '<div class="metric"><div class="v">' + Math.round(v.tss || 0) + '</div><div class="l">TSS</div></div>';
    h += '<div class="metric"><div class="v">' + esc(v.type || '–') + '</div><div class="l">type</div></div>';
    h += '</div>';
    if (v.reden) {
      h += '<div class="muted">' + esc(v.reden) + '</div>';  // v2c: waarom-deze-training regel
    }
    if (v.waarom && v.waarom.length) {
      h += '<details><summary>Waarom deze training?</summary><ul>';
      v.waarom.forEach(function (w) { h += '<li>' + esc(w) + '</li>'; });
      h += '</ul></details>';
    }
    h += '</div>';
    return h;
  }

  function actualKaart(a) {
    if (!a) return '';
    var h = '<div class="card"><h3>✅ ' + esc(a.naam) + '</h3><div class="metrics">';
    h += '<div class="metric"><div class="v">' + uMin(a.duurMin) + '</div><div class="l">duur</div></div>';
    h += '<div class="metric"><div class="v">' + (a.tss != null ? Math.round(a.tss) : '–') + '</div><div class="l">TSS</div></div>';
    h += '<div class="metric"><div class="v">' + (a.rpe != null ? a.rpe : '–') + '</div><div class="l">RPE</div></div>';
    h += '</div>';
    if (a.mismatch != null && a.rpeVerwacht != null) {
      var t = a.mismatch > 0 ? ('+' + nl(a.mismatch, 1) + ' zwaarder dan verwacht (~' + a.rpeVerwacht + ')')
            : (a.mismatch < 0 ? (nl(a.mismatch, 1) + ' lichter dan verwacht') : 'precies op verwachting');
      h += '<div class="muted">RPE-mismatch: ' + t + '</div>';
    }
    h += '</div>';
    return h;
  }

  // ── Schema (Vandaag + Kalender samengevoegd) ──
  function renderSchema() {
    var vd = state.vandaag;
    document.getElementById('schema-datum').textContent = vd ? (vd.weekdag + ' · ' + vd.dateISO) : '';
    // Status-graphic bovenaan.
    document.getElementById('schema-status').innerHTML = state.vorm ? statusGraphicHtml('schema') : '';

    var strip = '';
    (state.dagen || []).forEach(function (d) {
      var mark = '';
      if (d.status === 'voltooid') mark = '✓';
      else if (d.status === 'vandaag') mark = '●';
      else if (d.status === 'rust') mark = '·';
      else if (d.status === 'preview') mark = '~';
      var dot = d.kleur ? '<div class="dot" style="background:' + d.kleur + '"></div>' : '<div class="dot" style="background:transparent"></div>';
      var sel = (d.dateISO === selectedDate) ? ' sel' : '';
      var wd = d.weekdag.slice(0, 2);
      strip += '<div class="chip' + sel + '" data-date="' + d.dateISO + '" onclick="selectDay(\'' + d.dateISO + '\')">' +
        '<div class="cw">' + wd + '</div>' +
        '<div class="cd">' + d.kort.replace(/^.. /, '') + '</div>' +
        dot + '<div class="mark">' + mark + '</div></div>';
    });
    document.getElementById('dag-strip').innerHTML = strip;
    renderDagDetail();
    setTimeout(scrollSelectedChip, 30);  // vandaag in beeld
  }

  function selectDay(dISO) {
    selectedDate = dISO;
    document.querySelectorAll('.chip').forEach(function (c) {
      c.classList.toggle('sel', c.getAttribute('data-date') === dISO);
    });
    renderDagDetail();
  }

  // ── v2b-A: regenerate + push ──
  function regenWeek() {
    var b = document.getElementById('btn-regen');
    if (b) { b.disabled = true; b.textContent = 'Bezig…'; }
    setActStatus('');
    google.script.run
      .withSuccessHandler(function (s) { onState(s); resetActBtns(); setActStatus('✅ Voorstel bijgewerkt'); })
      .withFailureHandler(function (err) { showError(err); resetActBtns(); })
      .regenerateWeb();
  }
  function pushGarmin() {
    var b = document.getElementById('btn-push');
    if (b) { b.disabled = true; b.textContent = 'Bezig…'; }
    setActStatus('');
    google.script.run
      .withSuccessHandler(onPushResult)
      .withFailureHandler(function (err) { showError(err); resetActBtns(); })
      .pushWeb();
  }
  function onPushResult(res) {
    res = res || {};
    if (res.errors && res.errors.length) setActStatus('⚠️ ' + res.errors.join(' · '));
    else if (res.pushedCount > 0) setActStatus('✅ ' + res.pushedCount + ' workouts naar Garmin gepusht');
    else setActStatus('Geen workouts om te pushen' + (res.skipped && res.skipped.length ? ' (' + res.skipped.length + ' overgeslagen)' : ''));
    resetActBtns();
  }
  function setActStatus(t) { var e = document.getElementById('act-status'); if (e) e.textContent = t; }
  function resetActBtns() {
    var r = document.getElementById('btn-regen'); if (r) { r.disabled = false; r.textContent = 'Regenereer voorstel'; }
    var p = document.getElementById('btn-push'); if (p) { p.disabled = false; p.textContent = 'Push naar Garmin'; }
  }

  // ── v2a: beschikbaarheid-editor (write-pad) ──
  function renderBeschikbaarheid() {
    var av = state.availability || [];
    var opts = state.dagtypeOptions || [];
    var rows = av.map(function (d, i) {
      var sel = opts.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === d.dagtype ? ' selected' : '') + '>' + esc(o) + '</option>';
      }).join('');
      return '<div class="avail-row">' +
        '<label class="avail-dag"><input type="checkbox" data-av="train" data-idx="' + i + '"' + (d.train ? ' checked' : '') + '> ' + esc(d.dagLabel) + '</label>' +
        '<input type="number" class="avail-min" data-av="min" data-idx="' + i + '" min="0" max="600" step="5" value="' + (d.minuten || 0) + '">' +
        '<select class="avail-type" data-av="type" data-idx="' + i + '"><option value="">—</option>' + sel + '</select>' +
        '</div>';
    }).join('');
    document.getElementById('avail-rows').innerHTML = rows;
    var btn = document.getElementById('avail-save');
    if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; }
  }

  function saveAvail() {
    var updates = [];
    for (var i = 0; i < 7; i++) {
      updates.push({
        train: !!document.querySelector('[data-av="train"][data-idx="' + i + '"]').checked,
        minuten: Number(document.querySelector('[data-av="min"][data-idx="' + i + '"]').value) || 0,
        dagtype: document.querySelector('[data-av="type"][data-idx="' + i + '"]').value || ''
      });
    }
    var btn = document.getElementById('avail-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Opslaan…'; }
    google.script.run
      .withSuccessHandler(onState)
      .withFailureHandler(function (err) { showError(err); if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; } })
      .saveAvailability(updates);
  }

  function renderDagDetail() {
    var d = (state.dagen || []).filter(function (x) { return x.dateISO === selectedDate; })[0];
    var el = document.getElementById('dag-detail');
    if (!d) { el.innerHTML = ''; return; }
    var h = '<div class="muted" style="text-transform:capitalize;margin-bottom:6px">' + esc(d.weekdag) + ' ' + esc(d.kort) + '</div>';

    if (d.status === 'vandaag') {
      // Rijke vandaag-inhoud uit state.vandaag (status-graphic staat al bovenaan).
      var v = state.vandaag;
      var g = v.gereedheid, cls = 'b-' + (g.signaal === 'normal' ? 'normaal' : g.signaal);
      h += '<div class="banner ' + cls + '">' +
        (g.signaal === 'normal' ? '✅ Gereedheid normaal' : '⚠️ ' + esc(g.label || g.signaal)) +
        (g.vorm != null ? ' · Vorm ' + g.vorm + ' (' + esc(g.vormZone) + ')' : '') + '</div>';
      h += '<div class="card"><div class="muted">Garmin-verwachting</div><div class="accent" style="font-weight:700">' +
        esc(v.garminStatus.verdict) + '</div></div>';
      if (v.status === 'rust') {
        h += '<div class="card"><h3>Rustdag</h3><div class="muted">Geen training gepland vandaag. Herstel is training.</div></div>';
      } else {
        if (v.voorstel) h += voorstelKaart(v.voorstel);
        if (v.actual)   h += actualKaart(v.actual);
        if (!v.voorstel && !v.actual) h += '<div class="card"><div class="muted">Nog geen voorstel — draai Genereer voorstel in de Sheet.</div></div>';
      }
    } else if (d.status === 'preview') {
      h += '<div class="card"><div class="muted">Volgende week — ' +
        (d.previewMin ? '~' + d.previewMin + ' min gepland (nog niet uitgewerkt)' : 'nog niet ingepland') + '</div></div>';
    } else if (d.status === 'voltooid' && d.actual) {
      h += actualKaart(d.actual);
      if (d.voorstel) h += voorstelKaart(d.voorstel);
    } else if (d.voorstel) {
      h += voorstelKaart(d.voorstel);
    } else {
      h += '<div class="card"><div class="muted">Geen training deze dag.</div></div>';
    }
    el.innerHTML = h;
  }

  // ── Vorm: status-first ──
  var STATUS_DEF = {
    'Bouwt op':   { cls: 'st-bouwt',  bg: 'st-bouwt-bg',  verdict: 'Je bouwt fitheid op.',
      uitleg: 'Je trainingslast stijgt sneller dan je fitheid is ingehaald. In een opbouwblok precies goed: je vraagt meer dan je lijf gewend is, zo groeit vorm. Houd herstel in de gaten.' },
    'Onderhoudt': { cls: 'st-onderh', bg: 'st-onderh-bg', verdict: 'Je houdt je fitheid vast.',
      uitleg: 'Je traint genoeg om fitheid vast te houden, niet genoeg om te groeien. Prima in onderhoud of taper; suboptimaal als je wilt opbouwen.' },
    'Te veel':    { cls: 'st-teveel', bg: 'st-teveel-bg', verdict: 'Je vermoeidheid loopt voor.',
      uitleg: 'Je vermoeidheid loopt flink voor op je fitheid. Een paar dagen kan, langer is blessure-/overtraining-risico. Plan herstel in.' },
    'Achteruit':  { cls: 'st-achter', bg: 'st-achter-bg', verdict: 'Fitheid zakt langzaam weg.',
      uitleg: 'Je bent erg uitgerust — te lang weinig prikkel en fitheid zakt langzaam weg. Bouw de last weer op, tenzij dit een bewuste rustweek is.' },
    'Fris':       { cls: 'st-fris',   bg: 'st-fris-bg',   verdict: 'Uitgerust, fitheid intact.',
      uitleg: 'Je bent uitgerust met fitheid grotendeels intact. Ideaal vlak voor een belangrijke rit of event.' }
  };

  function statusVoor(v) {
    if (!v.huidig) return null;
    var z = v.huidig.vormZone, ramp = v.huidig.ramp, rb = v.rampBuildMin != null ? v.rampBuildMin : 3;
    if (z === 'Hoog risico') return 'Te veel';
    if (z === 'Overgang')    return 'Achteruit';
    if (z === 'Fris')        return 'Fris';
    // Optimaal / Grijze zone
    return (ramp != null && ramp >= rb) ? 'Bouwt op' : 'Onderhoudt';
  }

  function ringSvg(dagenTot) {
    var r = 42, C = 2 * Math.PI * r;
    var frac = (dagenTot == null) ? 0 : Math.max(0, Math.min(1, 1 - dagenTot / 90));
    var fill = frac * C;
    return '<svg width="110" height="110" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#e2e8f0" stroke-width="9"></circle>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#5B5BD6" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + fill.toFixed(1) + ' ' + (C - fill).toFixed(1) + '"></circle></svg>';
  }

  // Gedeelde status-graphic (Vorm-tab + Vandaag). sfx = unieke suffix zodat
  // de "i"-uitleg per mount eigen id heeft (geen duplicate-id-conflict).
  function statusGraphicHtml(sfx) {
    var v = state.vorm, ev = v.event || {};
    var st = statusVoor(v);
    var def = st ? STATUS_DEF[st] : null;
    var dagen = ev.dagenTot;
    var ringMid = (dagen != null)
      ? '<div class="big">' + dagen + '</div><div class="lbl">dagen</div>'
      : '<div class="big">–</div><div class="lbl">geen event</div>';
    var sub = (dagen != null && ev.naam) ? 'tot ' + esc(ev.naam) : 'geen event gepland';
    var left = '<div class="status-left"><div class="ring-wrap">' + ringSvg(dagen) +
      '<div class="ring-mid">' + ringMid + '</div></div>' +
      '<div class="ring-sub">' + sub + '</div>' +
      (v.macroFase ? '<div class="fase-pill">' + esc(v.macroFase) + '</div>' : '') + '</div>';
    var right;
    if (def) {
      right = '<div class="status-right ' + def.bg + '">' +
        '<div class="status-i" onclick="toggleUitleg(\'' + sfx + '\')">i</div>' +
        '<div class="status-word ' + def.cls + '">' + st + '</div>' +
        '<div class="status-verdict">' + esc(def.verdict) + '</div></div>';
    } else {
      right = '<div class="status-right"><div class="status-verdict">Geen vorm-data.</div></div>';
    }
    // KAART 2 — W/kg-ankerniveau (2a; conditie-modifier volgt in 2b).
    // niveau/wkg staan top-level op state (niet op state.vorm).
    var nivGetal = (state.niveau != null) ? nl(state.niveau, 1) : '–';
    var nivWkg = (state.wkg != null) ? nl(state.wkg, 2) + ' W/kg' : '–';
    // 2b-2 adherence-subtekst, STRIKT binnen .niveau-block na .niveau-wkg.
    // voortgangPct staat top-level op state. Null → regel weglaten (geen "–% van plan").
    var voortgang = (state.voortgangPct != null)
      ? '<div class="niveau-voortgang">' + nl(state.voortgangPct, 0) + '% van plan</div>'
      : '<div class="niveau-voortgang">blok net gestart</div>';
    // 2b-3: beginniveau→huidig delta (− blijft − via nl). Geen begin-data → weglaten.
    var progressie = (state.niveauDelta != null && state.beginLabel)
      ? '<div class="niveau-progressie">' + (state.niveauDelta >= 0 ? '+' : '') +
        nl(state.niveauDelta, 1) + ' sinds ' + esc(state.beginLabel) + '</div>' : '';
    var card2 = '<div class="status-card"><div class="niveau-block">' +
      '<div class="niveau-getal">' + nivGetal + '</div>' +
      '<div class="niveau-label">Niveau</div>' +
      '<div class="niveau-wkg">' + nivWkg + '</div>' + voortgang + progressie + '</div></div>';

    return '<div class="status-wrap" id="swrap-' + sfx + '" onscroll="syncDots(\'' + sfx + '\')">' +
      '<div class="status-card">' + left + right + '</div>' + card2 + '</div>' +
      '<div class="status-dots" id="sdots-' + sfx + '"><span class="dot active"></span><span class="dot"></span></div>' +
      '<div class="explainer" id="vorm-uitleg-' + sfx + '" style="display:none">' +
      (def ? esc(def.uitleg) : '') + '</div>';
  }

  // Dot-indicator synct met de swipe-positie van de status-deck.
  function syncDots(sfx) {
    var track = document.getElementById('swrap-' + sfx);
    var dots = document.getElementById('sdots-' + sfx);
    if (!track || !dots) return;
    var idx = Math.round(track.scrollLeft / track.clientWidth);
    for (var i = 0; i < dots.children.length; i++) {
      dots.children[i].classList.toggle('active', i === idx);
    }
  }
  function renderVormStatus() {
    document.getElementById('vorm-status').innerHTML = statusGraphicHtml('vorm');
  }
  function toggleUitleg(sfx) {
    var el = document.getElementById('vorm-uitleg-' + sfx);
    if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
  }

  // ── Vorm: trend & details ──
  function renderVorm() {
    renderVormStatus();
    var v = state.vorm;
    var hu = '';
    if (v.huidig) {
      hu = '<div class="card"><div class="metrics">' +
        '<div class="metric"><div class="v">' + v.huidig.vorm + '</div><div class="l">Vorm</div></div>' +
        '<div class="metric"><div class="v">' + v.huidig.ctl + '</div><div class="l">CTL</div></div>' +
        '<div class="metric"><div class="v">' + v.huidig.atl + '</div><div class="l">ATL</div></div>' +
        '</div><div class="muted">' + esc(v.huidig.vormZone) +
        (v.huidig.ramp != null ? ' · ramp ' + nl(v.huidig.ramp, 1) + '/wk' : '') +
        (v.ftp ? ' · FTP ' + v.ftp + 'W' : '') + '</div></div>';
    } else {
      hu = '<div class="card muted">Geen vorm-data.</div>';
    }
    document.getElementById('vorm-huidig').innerHTML = hu;
    renderVormStats();
    document.getElementById('niveau-trend-sub').textContent =
      'W/kg-niveau per maand sinds ' + (state.beginLabel || 'start');
  }

  function renderVormStats() {
    var s = state.vorm.stats[statPeriod] || { tss: 0, tijdMin: 0, ritten: 0 };
    var span = state.vorm.spanDagen || 0;
    var venster = { d7: 7, d28: 28, jaar: 365 }[statPeriod] || 0;
    // Eerlijk degraderen: toont de Activiteiten-tab minder historie dan het
    // gekozen venster, meld de echte dekking i.p.v. stil 28d=jaar te tonen.
    var note = '';
    if (venster && span && span < venster - 1) {
      var sinds = state.vorm.eersteDatum ? state.vorm.eersteDatum.split('-').reverse().join('-') : null;
      note = '<div class="muted" style="margin-top:8px">Slechts ' + span + ' dagen historie' +
        (sinds ? ' (sinds ' + sinds + ')' : '') + ' — meer nog niet gesynct.</div>';
    }
    document.getElementById('vorm-stats').innerHTML =
      '<div class="card"><div class="metrics">' +
      '<div class="metric"><div class="v">' + s.ritten + '</div><div class="l">ritten</div></div>' +
      '<div class="metric"><div class="v">' + uMin(s.tijdMin) + '</div><div class="l">tijd</div></div>' +
      '<div class="metric"><div class="v">' + Math.round(s.tss) + '</div><div class="l">TSS</div></div>' +
      '</div>' + note + '</div>';
  }

  function drawVormChart() {
    if (!chartsReady || !state || !state.vorm) return;
    var reeks = state.vorm.reeks || [];
    if (!reeks.length) { document.getElementById('vorm-chart').innerHTML = '<div class="muted">Geen reeks-data.</div>'; return; }
    var dt = new google.visualization.DataTable();
    dt.addColumn('string', 'Datum');
    // Mensentaal-labels (technische afkorting klein tussen haakjes).
    dt.addColumn('number', 'Fitheid (CTL)'); dt.addColumn('number', 'Vermoeidheid (ATL)'); dt.addColumn('number', 'Vorm');
    reeks.forEach(function (r) {
      dt.addRow([r.dateISO.slice(5), r.ctl, r.atl, r.vorm]);
    });
    var chart = new google.visualization.LineChart(document.getElementById('vorm-chart'));
    chart.draw(dt, {
      legend: { position: 'top' },
      chartArea: { width: '85%', height: '68%' },
      colors: ['#00bfa5', '#ef6c00', '#64748b'],
      curveType: 'function',
      hAxis: { textStyle: { fontSize: 9 } },
      vAxis: { gridlines: { color: '#eef2f7' }, baselineColor: '#cbd5e1' },
      backgroundColor: 'transparent'
    });
    drawVormStrip(reeks);
  }

  // 'yyyy-MM' → "mmm 'jj" (NL maand-afkorting).
  var NL_MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  function nlMaandLabel_(yyyyMM) {
    var p = String(yyyyMM).split('-');
    var m = parseInt(p[1], 10) - 1;
    return (NL_MND[m] || '?') + " '" + p[0].slice(-2);
  }

  // 2c: niveau-per-maand trend. Eén reeks, auto-zoom Y op databereik,
  // interpolateNulls voor maanden zonder power-data.
  function drawNiveauChart() {
    if (!chartsReady || !state || !state.vorm || !state.vorm.niveauReeks) return;
    var reeks = state.vorm.niveauReeks;
    var el = document.getElementById('niveau-chart');
    if (!reeks.length) { el.innerHTML = '<div class="muted">Geen niveau-data.</div>'; return; }
    var dt = new google.visualization.DataTable();
    dt.addColumn('string', 'Maand');
    dt.addColumn('number', 'Niveau');
    dt.addColumn({ type: 'string', role: 'tooltip' });
    var mn = Infinity, mx = -Infinity;
    reeks.forEach(function (p) {
      var tip = null;
      if (p.niveau != null) {
        tip = nlMaandLabel_(p.maand) + ': ' + p.niveau.toFixed(1).replace('.', ',');
        if (p.ftp && p.gewicht) tip += ' (' + (p.ftp / p.gewicht).toFixed(2).replace('.', ',') + ' W/kg)';
        if (p.niveau < mn) mn = p.niveau;
        if (p.niveau > mx) mx = p.niveau;
      }
      dt.addRow([nlMaandLabel_(p.maand), p.niveau, tip]);
    });
    var opts = {
      legend: { position: 'none' },
      chartArea: { width: '85%', height: '70%' },
      colors: ['#5B5BD6'], curveType: 'function', interpolateNulls: true,
      hAxis: { textStyle: { fontSize: 9 } },
      vAxis: { gridlines: { color: '#eef2f7' }, baselineColor: '#cbd5e1' },
      backgroundColor: 'transparent'
    };
    if (mn !== Infinity) opts.vAxis.viewWindow = { min: Math.floor(mn - 1), max: Math.ceil(mx + 1) };
    new google.visualization.LineChart(el).draw(dt, opts);
  }

  // Vorm-zone-strip: Google Charts kan geen horizontale y-range-banden
  // tekenen, dus de Vorm-lijn krijgt z'n betekenis via een eigen SVG-strip
  // met subtiele zone-banden (drempels uit formZone_).
  function drawVormStrip(reeks) {
    var el = document.getElementById('vorm-strip');
    if (!el) return;
    var W = 100, H = 60, lo = -40, hi = 30;            // vaste domein-band
    function y(v) { v = Math.max(lo, Math.min(hi, v)); return H - ((v - lo) / (hi - lo)) * H; }
    // banden: [bovengrens-vorm, kleur] van hoog→laag
    var banden = [
      { top: hi, bot: 25,  kleur: '#e0f2fe' },  // Overgang
      { top: 25, bot: 5,   kleur: '#dcfce7' },  // Fris
      { top: 5,  bot: -10, kleur: '#f1f5f9' },  // Grijze zone
      { top: -10,bot: -30, kleur: '#e8e8fb' },  // Optimaal
      { top: -30,bot: lo,  kleur: '#fee2e2' }   // Hoog risico
    ];
    var bands = banden.map(function (b) {
      var yt = y(b.top), yb = y(b.bot);
      return '<rect x="0" y="' + yt.toFixed(1) + '" width="100" height="' + (yb - yt).toFixed(1) + '" fill="' + b.kleur + '"></rect>';
    }).join('');
    var n = reeks.length;
    var pts = reeks.map(function (r, i) {
      var x = n <= 1 ? 0 : (i / (n - 1)) * W;
      return x.toFixed(2) + ',' + y(r.vorm).toFixed(2);
    }).join(' ');
    var zeroY = y(0).toFixed(1);
    el.innerHTML = '<div class="strip-kop">Vorm in context</div>' +
      '<svg class="vorm-strip-svg" viewBox="0 0 100 60" preserveAspectRatio="none">' + bands +
      '<line x1="0" y1="' + zeroY + '" x2="100" y2="' + zeroY + '" stroke="#94a3b8" stroke-width="0.4" stroke-dasharray="2 2"></line>' +
      '<polyline points="' + pts + '" fill="none" stroke="#334155" stroke-width="1.2"></polyline></svg>' +
      '<div class="strip-legend"><span style="color:#0369a1">Overgang</span> · <span style="color:#15803d">Fris</span> · <span style="color:#64748b">Grijs</span> · <span style="color:#5B5BD6">Optimaal</span> · <span style="color:#b91c1c">Risico</span></div>';
  }

  // ── Navigatie ──
  function scrollSelectedChip() {
    var el = document.querySelector('.chip.sel');
    if (el) el.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  function switchTab(name) {
    ['schema', 'vorm'].forEach(function (t) {
      document.getElementById('tab-' + t).style.display = (t === name) ? 'block' : 'none';
    });
    document.querySelectorAll('#bottomnav button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === name);
    });
    if (name === 'vorm') { drawVormChart(); drawNiveauChart(); }
    // Schema opent op vandaag: scroll de geselecteerde chip in beeld zodra
    // de container zichtbaar is (scrollIntoView werkt niet op display:none).
    if (name === 'schema') setTimeout(scrollSelectedChip, 30);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('#bottomnav button').forEach(function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
    document.querySelectorAll('#period-toggle button').forEach(function (b) {
      b.addEventListener('click', function () {
        statPeriod = b.getAttribute('data-p');
        document.querySelectorAll('#period-toggle button').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        renderVormStats();
      });
    });
    boot();
  });
</script>
