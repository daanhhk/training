<script>
  var state = null;
  var selectedDate = null;
  var chartsReady = false;
  var checkinSel = { slaap: null, benen: null, stress: null };  // null = nog niet beantwoord (Vastleggen disabled)
  var checkinAutoOpened = false;

  // NL-decimaal helper.
  function nl(n, dec) {
    if (n == null || n === '') return '–';
    var x = (dec != null) ? Number(n).toFixed(dec) : String(n);
    return x.replace('.', ',');
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;' }[c]; }); }
  function uMin(m) { m = Math.round(m || 0); return Math.floor(m / 60) + 'u ' + (m % 60) + 'm'; }

  // Resolveer een CSS-kleurexpressie (var()/color-mix) → concrete rgb-string.
  // Google Charts kent geen CSS custom properties, dus tokeniseren we via een
  // probe-element dat de cascade resolvet op draw-tijd.
  function cssColor_(expr) {
    var p = document.createElement('span');
    p.style.cssText = 'color:' + expr + ';position:absolute;left:-9999px';
    document.body.appendChild(p);
    var c = getComputedStyle(p).color;
    document.body.removeChild(p);
    return c || expr;
  }

  // ── Boot ──
  function loadState() {
    google.script.run
      .withSuccessHandler(onState)
      .withFailureHandler(showError)
      .getDashboardState();
  }
  function boot() { loadState(); }
  function showError(err) {
    document.getElementById('loading').style.display = 'none';
    var e = document.getElementById('error');
    e.style.display = 'block';
    e.textContent = '⚠️ Kon dashboard niet laden: ' + (err && err.message ? err.message : err);
  }
  function onState(s) {
    selectedDate = s.vandaag ? s.vandaag.dateISO : null;   // INITIAL-ONLY (refresh reset de selectie niet)
    // Fase 2 — pre-select check-in-sheet uit opgeslagen waarden (heropenen toont ze).
    if (s.readiness && s.readiness.checkin) {              // INITIAL-ONLY
      checkinSel = { slaap: s.readiness.checkin.slaap, benen: s.readiness.checkin.benen, stress: s.readiness.checkin.stress };
    }
    document.getElementById('loading').style.display = 'none';        // INITIAL-ONLY
    document.getElementById('bottomnav').style.display = 'flex';
    var ab = document.getElementById('appbar'); if (ab) ab.style.display = 'flex';
    applyStateRender(s);                                   // state=s + appbar + 5 render-fns (gedeeld met refresh)
    switchTab('schema');                                   // INITIAL-ONLY (refresh springt niet terug naar schema)
    google.charts.load('current', { packages: ['corechart'] });       // INITIAL-ONLY (anders her-registreert drawNvTraj_)
    google.charts.setOnLoadCallback(function () { chartsReady = true; drawNvTraj_(); });
    maybeAutoOpenCheckin();                                // INITIAL-ONLY
    // Fase 2 — fire-and-forget background-refresh: incr-sync de verse rit de tab in +
    // her-render met verse 0-API state (serieel ná read-1 → geen race, geen tab-terugsprong).
    google.script.run
      .withSuccessHandler(onStateRefresh)
      .withFailureHandler(function (e) { /* stil: de instant-state blijft staan */ })
      .refreshActivities();
  }

  // Fase 2 — herhaalbare render-subset (idempotent): eerste boot via onState, background-
  // refresh via onStateRefresh. GEEN initial-only init (selectedDate / display-toggles /
  // switchTab / charts.load / maybeAutoOpenCheckin blijven in onState).
  function applyStateRender(s) {
    state = s;
    var aw = document.getElementById('appbar-week'); if (aw) aw.textContent = 'Week ' + isoWeek_(new Date());
    var an = document.getElementById('appbar-name'); if (an) an.textContent = (s.coachName || 'Coach');   // CSS uppercaset
    renderSchema();
    renderWeekLoad();
    renderVorm();
    renderTrainingen();
    renderNiveau();
  }

  function onStateRefresh(s) {
    applyStateRender(s);
    console.log('[bg-refresh] state ververst');   // TEMP fase2-verify — verwijderen bij close-out
  }

  // Globale app-header: ISO-kalenderweek (client, pure date) + settings-stub.
  function isoWeek_(d) { d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); var dn = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - dn + 3); var f = new Date(Date.UTC(d.getUTCFullYear(), 0, 4)); return 1 + Math.round(((d - f) / 86400000 - 3 + ((f.getUTCDay() + 6) % 7)) / 7); }
  // ── Instellingen-drawer (Fase 1: profiel/trainingsprofiel/doel/koppel-status/meldingen) ──
  var settingsSel = {};
  var SET_DOEL_LABEL = { FTP: 'FTP/drempel', Conditie: 'Duurvermogen', VO2max: 'VO2max', Beklimmingen: 'Klimmen' };
  // ── Events-CRUD (Fase 2) — werkkopie draagt verborgen velden (type/afstand/hm/klim/notitie) ──
  var eventsSel = [];
  var EV_PRIO_NEXT = { A: 'B', B: 'C', C: 'A' };
  var EV_PRIO_CLASS = { A: 'ev-prio-a', B: 'ev-prio-b', C: 'ev-prio-c' };
  function evTodayISO_() { var d = new Date(); var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (dd < 10 ? '0' + dd : dd); }
  function eventSet(i, k, v) { if (eventsSel[i]) eventsSel[i][k] = v; }
  // prio-cycle via DOM-update (geen full re-render → open Details-uitklap blijft open).
  function eventCycle(i) {
    if (!eventsSel[i]) return;
    var np = EV_PRIO_NEXT[eventsSel[i].prioriteit] || 'C';
    eventsSel[i].prioriteit = np;
    var btn = document.querySelector('.ev-prio[data-evi="' + i + '"]');
    if (btn) { btn.textContent = np; btn.className = 'ev-prio ' + (EV_PRIO_CLASS[np] || 'ev-prio-c'); }
  }
  var EV_KLIM_OPTS = [['lang', 'Lang'], ['kort', 'Kort'], ['gemengd', 'Gemengd'], ['vlak', 'Vlak']];
  function eventSetType(i, val) {   // Type-segment via DOM-class-toggle (geen re-render)
    if (!eventsSel[i]) return;
    eventsSel[i].type = val;
    document.querySelectorAll('.ev-seg-btn[data-evi="' + i + '"]').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-evt') === val);
    });
  }
  function eventDel(i) { eventsSel.splice(i, 1); settingsRender_(); }
  function eventAdd() {
    if (eventsSel.length >= 10) return;
    eventsSel.push({ datum: evTodayISO_(), naam: '', type: 'race', prioriteit: 'C', klimType: 'vlak', afstandKm: '', hm: '', notitie: '' });
    settingsRender_();
  }
  function eventsSectionHtml_() {
    var rows = eventsSel.length ? eventsSel.map(function (e, i) {
      var pc = EV_PRIO_CLASS[e.prioriteit] || 'ev-prio-c';
      var klimOpts = EV_KLIM_OPTS.map(function (o) {
        return '<option value="' + o[0] + '"' + ((e.klimType || 'vlak') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('');
      var afst = (e.afstandKm != null && e.afstandKm !== '') ? e.afstandKm : '';
      var hm = (e.hm != null && e.hm !== '') ? e.hm : '';
      return '<div class="ev-row">' +
        '<div class="ev-top">' +
          '<input type="text" class="ev-naam" value="' + esc(e.naam || '') + '" oninput="eventSet(' + i + ',\'naam\',this.value)" placeholder="Event-naam…">' +
          '<button type="button" class="ev-del" onclick="eventDel(' + i + ')" aria-label="Verwijder">✕</button>' +
        '</div>' +
        '<div class="ev-bot">' +
          '<button type="button" class="ev-prio ' + pc + '" data-evi="' + i + '" onclick="eventCycle(' + i + ')">' + esc(e.prioriteit || 'C') + '</button>' +
          '<input type="date" class="ev-date" value="' + esc(e.datum || '') + '" onchange="eventSet(' + i + ',\'datum\',this.value)">' +
        '</div>' +
        '<details class="ev-details"><summary>Details <span class="ev-chev">⌄</span></summary>' +
          '<div class="ev-det">' +
            '<div class="ev-det-row"><span class="ev-det-lbl">Type</span><div class="ev-seg">' +
              '<button type="button" class="ev-seg-btn' + (e.type === 'trip' ? ' is-on' : '') + '" data-evi="' + i + '" data-evt="trip" onclick="eventSetType(' + i + ',\'trip\')">Trip</button>' +
              '<button type="button" class="ev-seg-btn' + (e.type !== 'trip' ? ' is-on' : '') + '" data-evi="' + i + '" data-evt="race" onclick="eventSetType(' + i + ',\'race\')">Race</button>' +
            '</div></div>' +
            '<div class="ev-det-row"><span class="ev-det-lbl">Klim-type</span><select class="set-select" onchange="eventSet(' + i + ',\'klimType\',this.value)">' + klimOpts + '</select></div>' +
            '<div class="ev-det-row"><span class="ev-det-lbl">Afstand</span><span class="ev-det-ctl"><input type="number" class="set-input" value="' + afst + '" oninput="eventSet(' + i + ',\'afstandKm\',this.value)"><span class="ev-unit">km</span></span></div>' +
            '<div class="ev-det-row"><span class="ev-det-lbl">Hoogtemeters</span><span class="ev-det-ctl"><input type="number" class="set-input" value="' + hm + '" oninput="eventSet(' + i + ',\'hm\',this.value)"><span class="ev-unit">hm</span></span></div>' +
            '<div class="ev-det-row"><span class="ev-det-lbl">Notitie</span><input type="text" class="ev-note" value="' + esc(e.notitie || '') + '" oninput="eventSet(' + i + ',\'notitie\',this.value)"></div>' +
          '</div>' +
        '</details>' +
      '</div>';
    }).join('') : '<div class="ev-empty">Nog geen events</div>';
    return '<div class="set-sec">Events</div>' + rows +
      '<button type="button" class="ev-add" onclick="eventAdd()">+ Event toevoegen</button>';
  }
  function setWkg_() {
    var f = Number(settingsSel.ftp) || 0, g = Number(settingsSel.gewicht) || 0;
    return (f > 0 && g > 0) ? nl(f / g, 2) + ' W/kg' : '—';
  }
  function settingsSet(k, v) {
    settingsSel[k] = v;
    if (k === 'ftp' || k === 'gewicht') { var w = document.getElementById('set-wkg'); if (w) w.textContent = setWkg_(); }
  }
  function settingsSetBool(k, v) { settingsSel[k] = v; }
  function settingsSetDoel(v) { settingsSel.doel = v; settingsRender_(); }
  function settingsSetCoach(v) { settingsSel.coachName = v; settingsRender_(); }
  function settingsRender_() { var c = document.getElementById('overlay-content'); if (c) c.innerHTML = settingsDrawerHtml(); }
  function setTgl_(k, on) {
    return '<label class="tgl"><input type="checkbox"' + (on ? ' checked' : '') +
      ' onchange="settingsSetBool(\'' + k + '\',this.checked)"><span class="tgl-track"></span><span class="tgl-thumb"></span></label>';
  }
  function settingsDrawerHtml() {
    var s = settingsSel, ks = state.settings || {};
    var doelTiles = (ks.doelOpties || []).map(function (d) {
      return '<button type="button" class="set-tile' + (s.doel === d ? ' is-on' : '') + '" onclick="settingsSetDoel(\'' + d + '\')">' + esc(SET_DOEL_LABEL[d] || d) + '</button>';
    }).join('');
    var presetOpts = (ks.profielOpties || []).map(function (p) {
      return '<option value="' + esc(p) + '"' + (s.profielPreset === p ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('');
    var coachVal = (s.coachName != null ? s.coachName : 'Coach');
    var coachChips = ['Coach', 'Daan', 'Merckx', 'Sven', 'Anna'].map(function (n) {
      var on = (String(coachVal).trim().toLowerCase() === n.toLowerCase());
      return '<button type="button" class="set-chip' + (on ? ' is-on' : '') + '" onclick="settingsSetCoach(\'' + n + '\')">' + esc(n) + '</button>';
    }).join('');
    return '<div class="set-head"><div class="set-title">Instellingen</div>' +
        '<button type="button" class="set-close" data-overlay-close aria-label="Sluiten">✕</button></div>' +
      '<div class="set-sec">Jouw coach</div>' +
      '<div class="set-row"><span class="set-lbl">Naam van je coach</span><input type="text" class="set-input set-coach-input" maxlength="24" value="' + esc(coachVal) + '" oninput="settingsSet(\'coachName\',this.value)" placeholder="Coach"></div>' +
      '<div class="set-chips">' + coachChips + '</div>' +
      '<div class="set-sec">Profiel</div>' +
      '<div class="set-row"><span class="set-lbl">Naam</span><span class="set-ro">' + esc(ks.naam || '—') + '</span></div>' +
      '<div class="set-row"><span class="set-lbl">FTP</span><span class="set-ctl"><input type="number" class="set-input" value="' + (s.ftp != null ? s.ftp : '') + '" oninput="settingsSet(\'ftp\',this.value)"><span class="set-unit">W</span></span></div>' +
      '<div class="set-row"><span class="set-lbl">Gewicht</span><span class="set-ctl"><input type="number" step="0.1" class="set-input" value="' + (s.gewicht != null ? s.gewicht : '') + '" oninput="settingsSet(\'gewicht\',this.value)"><span class="set-unit">kg</span></span></div>' +
      '<div class="set-row"><span class="set-lbl">W/kg</span><span class="set-ro" id="set-wkg">' + setWkg_() + '</span></div>' +
      '<div class="set-row"><span class="set-lbl">FTP automatisch bijwerken</span>' + setTgl_('ftpAuto', s.ftpAuto === true) + '</div>' +
      '<div class="set-sec">Trainingsprofiel</div>' +
      '<div class="set-row"><span class="set-lbl">Volume-profiel</span><select class="set-select" onchange="settingsSet(\'profielPreset\',this.value)">' + presetOpts + '</select></div>' +
      '<div class="set-sec">Doel &amp; blok</div>' +
      '<div class="set-tiles">' + doelTiles + '</div>' +
      '<div class="set-row"><span class="set-lbl">Startdatum blok</span><input type="date" class="set-input set-date" value="' + (s.doelStart || '') + '" onchange="settingsSet(\'doelStart\',this.value)"></div>' +
      '<div class="set-row"><span class="set-lbl">Duur</span><span class="set-ctl"><input type="number" class="set-input" value="' + (s.doelDuur != null ? s.doelDuur : '') + '" oninput="settingsSet(\'doelDuur\',this.value)"><span class="set-unit">weken</span></span></div>' +
      '<div class="set-sec">Koppelingen</div>' +
      '<div class="set-row"><span class="set-lbl">intervals.icu</span><span class="set-badge' + (ks.gekoppeld ? ' is-on' : '') + '">' + (ks.gekoppeld ? 'Gekoppeld' : 'Niet gekoppeld') + '</span></div>' +
      (ks.athleteId ? '<div class="set-row"><span class="set-lbl">Athlete-ID</span><span class="set-ro">' + esc(ks.athleteId) + '</span></div>' : '') +
      '<div class="set-row"><span class="set-lbl">API-key</span><span class="set-ro">••••••••</span></div>' +
      '<div class="set-row"><span class="set-lbl">Garmin</span><span class="set-ro">' + (ks.garminLastSync ? 'Gesynct · ' + esc(ks.garminLastSync) : 'Niet gesynct') + '</span></div>' +
      '<div class="set-sec">Meldingen</div>' +
      '<div class="set-row"><span class="set-lbl">Zondag-herinnering</span>' + setTgl_('sundayReminder', s.sundayReminder === true) + '</div>' +
      eventsSectionHtml_() +
      '<button type="button" class="set-save" onclick="saveSettingsEditor()">Opslaan</button>';
  }
  function openSettings() {
    var ks = state.settings || {};
    settingsSel = { ftp: ks.ftp, gewicht: ks.gewicht, ftpAuto: ks.ftpAuto === true, profielPreset: ks.profielPreset,
      doel: ks.doel, doelStart: ks.doelStart, doelDuur: ks.doelDuur, sundayReminder: ks.sundayReminder === true,
      coachName: ks.coachName != null ? ks.coachName : 'Coach' };
    eventsSel = (state.events || []).map(function (e) {
      return { datum: e.datum, naam: e.naam, type: e.type, prioriteit: e.prioriteit, klimType: e.klimType, afstandKm: e.afstandKm, hm: e.hm, notitie: e.notitie };
    });
    openDrawer({ variant: 'drawer', html: settingsDrawerHtml() });
  }
  function saveSettingsEditor() {
    var btn = document.querySelector('.set-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Opslaan…'; }
    function fail(err) { if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; } showError(err); }
    // Persisteer beide: settings → dan events → verse state (één onState).
    google.script.run
      .withSuccessHandler(function () {
        google.script.run
          .withSuccessHandler(function (s) { closeDrawer(); onState(s); setActStatus('✅ Instellingen opgeslagen'); })
          .withFailureHandler(fail)
          .saveEvents(eventsSel);
      })
      .withFailureHandler(fail)
      .saveSettings(settingsSel);
  }

  // ── Zone-bar SVG — schaalt ALTIJD naar 100% breedte; kleuren via zone-tokens
  //    (bucket → --zone-1…6) i.p.v. de server-hex. mini = compacte variant.
  var ZONE_VAR = { rust: '--zone-1', z2: '--zone-2', low: '--zone-2', tempo: '--zone-3',
                   high: '--zone-4', drempel: '--zone-4', anaeroob: '--zone-5', anaerobic: '--zone-5' };
  function zoneBar(segmenten, mini) {
    if (!segmenten || !segmenten.length) return '<div class="muted">Geen structuur beschikbaar.</div>';
    var W = 100, H = 100, MINW = 1.4, GAP = 0.6;
    var totMin = segmenten.reduce(function (a, b) { return a + b.minuten; }, 0) || 1;
    var raw = segmenten.map(function (sg) { return Math.max(MINW, (sg.minuten / totMin) * W); });
    var sum = raw.reduce(function (a, b) { return a + b; }, 0) || 1;
    var x = 0, parts = '';
    segmenten.forEach(function (sg, i) {
      var w = (raw[i] / sum) * W;           // renormaliseer naar exact 100
      var hh = sg.hoogtePct, y = H - hh;
      var bw = Math.max(0.8, w - GAP);      // smalle gap tussen staven (mockup 424c9d)
      var col = 'var(' + (ZONE_VAR[sg.bucket] || '--zone-2') + ')';
      parts += '<rect x="' + x.toFixed(2) + '" y="' + y + '" width="' + bw.toFixed(2) + '" height="' + hh + '" style="fill:' + col + '" rx="0.8"></rect>';
      x += w;
    });
    return '<svg class="' + (mini ? 'wk-minibar' : 'wk-zonebar') + '" viewBox="0 0 100 100" preserveAspectRatio="none">' + parts + '</svg>';
  }

  function wkMetric_(val, lbl) {
    return '<div class="wk-metric"><div class="wk-mv">' + val + '</div><div class="wk-ml">' + lbl + '</div></div>';
  }
  function wkWhy_(v) {
    if (!v.waarom || !v.waarom.length) return '';
    var li = v.waarom.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('');
    return '<details class="wk-why"><summary>Waarom deze training?</summary><ul>' + li + '</ul></details>';
  }

  // §1d-extra's: zone-badge (primaire zone), ZoneLegend, inklapbare Blokstructuur, IF-metric.
  // Labels = zone-NAMEN (niet Z-nummers) → coherent met badgeHtml_/INTENT_BADGE: zelfde
  // naam per --zone-token (1 Herstel · 2 Duur · 3 Tempo · 4 Drempel · 6 VO2max).
  var ZONE_LABEL = { rust: 'Herstel', z2: 'Duur', low: 'Duur', tempo: 'Tempo', high: 'Drempel', drempel: 'Drempel', anaeroob: 'VO2max', anaerobic: 'VO2max' };
  // Primaire zone = zwaarste bucket met SIGNIFICANTE duur (≥ max(8min, 12% totaal),
  // rust uitgesloten). "Lange Z2" → Z2 (kort piek-blokje telt niet); interval-workout
  // → de interval-zone (niet de Z2-recovery die in minuten domineert).
  function primaryBucket_(segs) {
    if (!segs || !segs.length) return null;
    var total = 0, by = {};
    segs.forEach(function (s) {
      var m = s.minuten || 0; total += m;
      if (!by[s.bucket]) by[s.bucket] = { bucket: s.bucket, min: 0, h: s.hoogtePct || 0 };
      by[s.bucket].min += m;
    });
    var thresh = Math.max(8, total * 0.12);
    var cand = Object.keys(by).map(function (k) { return by[k]; });
    var sig = cand.filter(function (b) { return b.min >= thresh && b.bucket !== 'rust'; });
    if (!sig.length) sig = cand;
    var best = sig[0];
    sig.forEach(function (b) { if (b.h > best.h || (b.h === best.h && b.min > best.min)) best = b; });
    return best.bucket;
  }
  function zoneBadge_(segs) {
    var b = primaryBucket_(segs);
    if (!b) return '';
    var z = ZONE_VAR[b] || '--zone-2';
    return '<span class="zbadge" style="color:var(' + z + ');border-color:var(' + z + ')">' + (ZONE_LABEL[b] || 'Duur') + '</span>';
  }
  // §1d-badge = workout-INTENT-categorie (mock toont "VO2max"), niet de piek/duur-bucket.
  // Namen uit de mock; kleuren 1-op-1 uit de --zone-*-coupling. Onbekend type → fallback zoneBadge_.
  var INTENT_BADGE = {
    recovery: { label: 'Herstel', z: '--zone-1' }, test: { label: 'Herstel', z: '--zone-1' },
    long_z2: { label: 'Duur', z: '--zone-2' }, pendel_z2: { label: 'Duur', z: '--zone-2' },
    fatox: { label: 'Duur', z: '--zone-2' }, combo_long_with_efforts: { label: 'Duur', z: '--zone-2' },
    combo_z2_vo2: { label: 'VO2max', z: '--zone-5' },
    tempo: { label: 'Tempo', z: '--zone-3' },
    sweet_spot: { label: 'Sweet Spot', z: '--zone-4' }, ss_lang: { label: 'Sweet Spot', z: '--zone-4' },
    combo_ss_sprints: { label: 'Sweet Spot', z: '--zone-4' }, pendel_conditie_intervals: { label: 'Sweet Spot', z: '--zone-4' },
    pendel_trip_intervals: { label: 'Sweet Spot', z: '--zone-4' },
    threshold: { label: 'Drempel', z: '--zone-4' }, ftp: { label: 'Drempel', z: '--zone-4' },
    pendel_ftp_intervals: { label: 'Drempel', z: '--zone-4' },
    big_gear: { label: 'Klim', z: '--zone-4' }, bergsim: { label: 'Klim', z: '--zone-4' },
    low_cad: { label: 'Klim', z: '--zone-4' }, pendel_climb_intervals: { label: 'Klim', z: '--zone-4' },
    vo2max: { label: 'VO2max', z: '--zone-5' }, vo2_short: { label: 'VO2max', z: '--zone-5' },
    vo2_medium: { label: 'VO2max', z: '--zone-5' }, vo2_long: { label: 'VO2max', z: '--zone-5' },
    vo2_3015: { label: 'VO2max', z: '--zone-5' }, microbursts: { label: 'VO2max', z: '--zone-5' },
    pendel_vo2_intervals: { label: 'VO2max', z: '--zone-5' }
  };
  function badgeHtml_(v) {
    var b = (v && v.type) ? INTENT_BADGE[v.type] : null;
    if (b) return '<span class="zbadge" style="color:var(' + b.z + ');border-color:var(' + b.z + ')">' + b.label + '</span>';
    return (v && v.segmenten) ? zoneBadge_(v.segmenten) : '';   // onbekend/ontbrekend type → primaryBucket_-fallback
  }
  function zoneLegend_(segs) {
    if (!segs || !segs.length) return '';
    var seen = {}, items = [];
    segs.forEach(function (s) {
      if (seen[s.bucket]) return; seen[s.bucket] = true;
      var z = ZONE_VAR[s.bucket] || '--zone-2';
      items.push('<span class="zleg-item"><span class="zleg-dot" style="background:var(' + z + ')"></span>' + (ZONE_LABEL[s.bucket] || 'Duur') + '</span>');
    });
    return '<div class="zleg">' + items.join('') + '</div>';
  }
  function blokLijst_(segs) {
    if (!segs || !segs.length) return '';
    var rows = segs.map(function (s) {
      var z = ZONE_VAR[s.bucket] || '--zone-2';
      return '<div class="blok-row"><span class="blok-zone" style="color:var(' + z + ')">' + (ZONE_LABEL[s.bucket] || 'Duur') + '</span><span class="blok-min">' + uMin(s.minuten) + '</span></div>';
    }).join('');
    return '<div class="bloklist">' + rows + '</div>';
  }
  // Optie D: blok-lijst uit de server-structuur (label · duur · doel-watt; = ZWO/Garmin).
  // wattFmt_ = ALLEEN display: "242-261W" → "242–261 W" (engine/ZWO-string ongemoeid).
  function wattFmt_(s) {
    return String(s == null ? '' : s).replace(/(\d)\s*-\s*(\d)/, '$1–$2').replace(/\s*W$/, ' W');
  }
  function blokLijstStruct_(struct) {
    var rows = struct.map(function (r) {
      return '<div class="blok-row"><span class="blok-zone">' + esc(r[0]) + '</span>' +
        '<span class="blok-min">' + esc(r[1]) + ' · ' + wattFmt_(esc(r[2])) + '</span></div>';
    }).join('');
    return '<div class="bloklist">' + rows + '</div>';
  }
  // Optie B-live: blok-lijst uit (geschaalde) segmenten — label = zone-naam, duur
  // = afgeronde minuten, watt = ftp×pct. Voedt de twee duur-slider-oppervlakken
  // (Trainingen-detail + WorkoutPicker) zodat de lijst meeschaalt; mirrort de
  // server-wattformule (watts = round(ftp×pct/100)).
  function wattFromPct_(ftp, lo, hi) {
    if (lo == null || hi == null || !ftp) return '';
    return Math.round(ftp * lo / 100) + '-' + Math.round(ftp * hi / 100) + 'W';
  }
  function blokLijstSegs_(segs) {
    if (!segs || !segs.length) return '';
    var rows = segs.map(function (s) {
      var z = ZONE_VAR[s.bucket] || '--zone-2';
      var w = wattFmt_(wattFromPct_(state.ftp, s.pctLo, s.pctHi));
      return '<div class="blok-row"><span class="blok-zone" style="color:var(' + z + ')">' +
        (ZONE_LABEL[s.bucket] || 'Duur') + '</span><span class="blok-min">' +
        (Math.round(s.minuten) + ' min') + (w ? ' · ' + w : '') + '</span></div>';
    }).join('');
    return '<div class="bloklist">' + rows + '</div>';
  }
  // ZoneBar + ZoneLegend (klikbaar) → klapt de Blokstructuur uit/in (INTERACTIONS §1d).
  // Lijst + teller uit structuur (watt); valt terug op segmenten als structuur ontbreekt.
  // fromSegs=true → lijst uit (geschaalde) segmenten i.p.v. de statische structuur
  // (duur-slider-oppervlakken); default OFF → byte-identiek aan voorheen.
  function zoneBlock_(segs, struct, fromSegs) {
    var useStruct = !fromSegs && !!(struct && struct.length);
    var lijst = fromSegs ? blokLijstSegs_(segs) : (useStruct ? blokLijstStruct_(struct) : blokLijst_(segs));
    var n = fromSegs ? ((segs && segs.length) ? segs.length : 0)
                     : (useStruct ? struct.length : ((segs && segs.length) ? segs.length : 0));
    return '<details class="wk-blocks"><summary>' + zoneBar(segs) + zoneLegend_(segs) +
      '<div class="wk-blokhint">Blokstructuur · ' + n + ' blok' + (n === 1 ? '' : 'ken') + ' <span class="wk-chev">⌄</span></div></summary>' + lijst + '</details>';
  }
  // IF-proxy uit TSS + duur: IF = √(TSS / (uur × 100)). Client-display, geen server-calc.
  function ifProxy_(tss, durMin) {
    if (!tss || !durMin) return null;
    return Math.sqrt(tss / (durMin / 60 * 100));
  }
  // Mockup 424c9d: compacte inline-metrics "X min · IF Y · TSS Z" (vervangt de
  // 3-koloms .wk-metrics-grid in dag-detail). Vorm-MetricRow houdt wkMetric_/.wk-metrics.
  // Duur = rauwe minuten + " min" (uMin geeft "Xu Ym"; mockup toont "X min").
  function inlineMetrics_(durMin, tss) {
    var ifv = ifProxy_(tss, durMin);
    function n_(x) { return '<span class="wk-im-n">' + x + '</span>'; }
    return '<div class="wk-inline">' +
      n_(Math.round(durMin || 0)) + ' min · IF ' + n_(ifv != null ? nl(ifv, 2) : '–') +
      ' · TSS ' + n_(tss != null ? Math.round(tss) : '–') + '</div>';
  }

  // Skin §1d — workout-kaart. opts {overline, today}. Meerdere sessies → sunken sub-kaarten.
  function voorstelKaart(v, opts) {
    if (!v) return '';
    opts = opts || {};
    var ol = '<div class="wk-head-row"><div class="wk-overline' + (opts.today ? ' wk-today' : '') + '">' + esc(opts.overline || 'Voorstel') + '</div>' +
      badgeHtml_(v) + '</div>';
    var name = '<div class="wk-name">' + esc(v.titel) + '</div>';
    if (v.sessies && v.sessies.length > 1) {
      var subs = v.sessies.map(function (s) {
        return '<div class="wk-sub">' +
          '<div class="wk-sub-name">' + esc(s.titel || 'Sessie') + '</div>' +
          zoneBar(s.segmenten, true) +
          inlineMetrics_(s.duurMin, s.tss) +
          (s.eindopmerking ? '<div class="wk-note">' + esc(s.eindopmerking) + '</div>' : '') +
        '</div>';
      }).join('');
      return '<div class="wk-card">' + ol + name + subs + wkWhy_(v) + '</div>';
    }
    return '<div class="wk-card">' + ol + name + zoneBlock_(v.segmenten, v.structuur) +
      inlineMetrics_(v.duurMin, v.tss) +
      (v.reden ? '<div class="wk-note">' + esc(v.reden) + '</div>' : '') +
      wkWhy_(v) + '</div>';
  }

  // Fase 3c-A — RpeRating 1–10 (web-write). current = opgeslagen rpe of null.
  function rpeRatingHtml_(dateISO, current) {
    var btns = '';
    for (var i = 1; i <= 10; i++) {
      btns += '<button type="button" class="rpe-btn' + (current === i ? ' is-on' : '') +
        '" onclick="setRpe(\'' + dateISO + '\',' + i + ')">' + i + '</button>';
    }
    return '<div class="rpe-rate"><div class="rpe-label">RPE — hoe zwaar voelde het?</div>' +
      '<div class="rpe-row">' + btns + '</div></div>';
  }
  function actualKaart(a, dateISO) {
    if (!a) return '';
    var h = '<div class="wk-card">' +
      '<div class="wk-overline wk-ok">✓ Voltooid</div>' +
      '<div class="wk-name">' + esc(a.naam) + '</div>' +
      inlineMetrics_(a.duurMin, a.tss) +
      (dateISO ? rpeRatingHtml_(dateISO, a.rpe) : '');
    if (a.rpe != null && a.mismatch != null && a.rpeVerwacht != null) {
      var t = a.mismatch > 0 ? ('Zwaarder dan verwacht (+' + nl(a.mismatch, 1) + ' vs ~' + a.rpeVerwacht + ')')
            : (a.mismatch < 0 ? ('Lichter dan verwacht (' + nl(a.mismatch, 1) + ' vs ~' + a.rpeVerwacht + ')')
            : 'Precies op verwachting');
      h += '<div class="rpe-feedback">' + t + '</div>';
    }
    if (dateISO) h += rideAffordanceHtml_(dateISO);
    h += '</div>';
    return h;
  }

  // ── Fase 3c-B — skip-dispositie ──
  var DISP_LABEL = { geen_tijd: 'Geen tijd', bewust_gerust: 'Bewust gerust', iets_anders: 'Iets anders gedaan' };
  function canDispose_(d) {
    return d && d.voorstel && !d.actual && !d.dispositie && d.status !== 'rust' &&
           state.vandaag && d.dateISO <= state.vandaag.dateISO;
  }
  function dispositieAffordanceHtml_(dateISO) {
    var btns = Object.keys(DISP_LABEL).map(function (r) {
      return '<button type="button" class="disp-btn" onclick="setDisposition(\'' + dateISO + '\',\'' + r + '\')">' + DISP_LABEL[r] + '</button>';
    }).join('');
    return '<div class="disp-afford"><div class="disp-q">Niet gedaan?</div><div class="disp-row">' + btns + '</div></div>';
  }
  function gemistKaart_(d) {
    var reason = (d.dispositie && d.dispositie.reason) ? (DISP_LABEL[d.dispositie.reason] || d.dispositie.reason) : '';
    return '<div class="gemist-card">' +
      '<div class="gemist-txt">Gemist' + (reason ? ' · ' + esc(reason) : '') + '</div>' +
      '<button type="button" class="gemist-back" onclick="setDisposition(\'' + d.dateISO + '\',null)">Terug</button>' +
    '</div>';
  }
  function setRpe(dateISO, rpe) {
    google.script.run.withSuccessHandler(function (s) { state = s; renderSchema(); }).withFailureHandler(showError).saveRpe(dateISO, rpe);
  }
  function setDisposition(dateISO, reason) {
    google.script.run.withSuccessHandler(function (s) { state = s; renderSchema(); renderWeekLoad(); renderDagDetail(); }).withFailureHandler(showError).saveDisposition(dateISO, reason);
  }
  // Toggle-to-clear: wis de dispositie OPTIMISTISCH (voorstel zit lokaal) — lokaal terug
  // naar 't voorstel + dagstrip ×→dot, dan saveDisposition(null) op de achtergrond ZONDER
  // onState (instant UX, gerechtvaardigde afwijking zoals pushWeb). Fallback = round-trip.
  function clearDisposition(dateISO) {
    var dagen = state.dagen || [], d = null;
    for (var i = 0; i < dagen.length; i++) if (dagen[i].dateISO === dateISO) { d = dagen[i]; break; }
    if (d && d.voorstel) {
      d.dispositie = null; d.coach = null;
      d.status = (state.vandaag && dateISO === state.vandaag.dateISO) ? 'vandaag' : 'gepland';
      renderSchema(); renderDagDetail();
      google.script.run.withFailureHandler(showError).saveDisposition(dateISO, null);
    } else {
      setDisposition(dateISO, null);   // fallback: normale round-trip
    }
  }

  // ══ Coach-feedback (Fase 4b) — DoneDetail (08/09) + GemistDetail (10) ══
  var ALIGN_VAR_ = { 'on-plan': '--align-on-plan', deviated: '--align-deviated', different: '--align-different', missed: '--align-missed' };
  var ALIGN_SOFT_ = { 'on-plan': '--align-on-plan-soft', deviated: '--align-deviated-soft', different: '--align-different-soft', missed: '--align-missed-soft' };
  var COACH_GLYPH_ = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h9A1.5 1.5 0 0 1 14 4.5v5A1.5 1.5 0 0 1 12.5 11H6.5L3.5 13.3V11A1.5 1.5 0 0 1 2 9.5z"/></svg>';
  var ADAPT_GLYPH_ = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v3M10.5 2v3"/></svg>';
  function cfDur_(mins) { mins = Math.round(mins || 0); var h = Math.floor(mins / 60), m = mins % 60; return h > 0 ? (h + 'u' + (m < 10 ? '0' + m : m)) : (m + ' min'); }
  function cfIfTxt_(v) { return v != null ? nl(v, 2) : '–'; }
  function coachBadge_(label, zoneVar) { return '<span class="zbadge" style="color:var(' + zoneVar + ');border-color:var(' + zoneVar + ')">' + esc(label) + '</span>'; }
  function alignChip_(state, label) {
    var v = ALIGN_VAR_[state] || '--text-muted', s = ALIGN_SOFT_[state] || '--bg-sunken';
    return '<span class="align-chip" style="color:var(' + v + ');background:var(' + s + ')"><span class="align-dot" style="background:var(' + v + ')"></span>' + esc(label) + '</span>';
  }
  function coachCallout_(c) {
    var border = c.isImpact ? 'var(--coach-border-impact)' : 'var(--coach-border)';
    var nm = ((state && state.coachName) || 'Coach').toUpperCase();
    var label = c.isImpact ? (nm + ' · IMPACT') : nm;
    var h = '<div class="coach-callout" style="background:var(--coach-bg);border-color:' + border + '">' +
      '<div class="coach-head"><span class="coach-mark" style="background:var(--coach-mark-bg);color:var(--coach-mark)">' + COACH_GLYPH_ + '</span>' +
      '<span class="coach-label" style="color:var(--coach-label)">' + label + '</span></div>' +
      '<div class="coach-text" style="color:var(--coach-text)">' + esc(c.narrative) + '</div>';
    if (c.adapt) {
      h += '<div class="coach-adapt" style="border-top-color:var(--coach-divider)">' +
        '<div class="coach-adapt-head"><span class="coach-adapt-icon" style="color:var(--coach-adapt-icon)">' + ADAPT_GLYPH_ + '</span>' +
        '<span class="coach-adapt-label" style="color:var(--coach-adapt-label)">AANPASSING</span></div>' +
        '<div class="coach-adapt-text" style="color:var(--coach-text)">' + esc(c.adapt) + '</div></div>';
    }
    return h + '</div>';
  }
  function coachReadingHtml_(c) {
    var p = c.planned, d = c.done, diffType = (c.state === 'different');
    function row(lbl, plv, dv, dvVar) {
      return '<div class="rd-row"><span class="rd-lbl">' + lbl + '</span><span class="rd-pl">' + plv + '</span>' +
        '<span class="rd-done"' + (dvVar ? ' style="color:var(' + dvVar + ')"' : '') + '>' + dv + '</span></div>';
    }
    return '<div class="rd-table">' +
      '<div class="rd-row rd-head"><span class="rd-lbl"></span><span class="rd-pl">GEPLAND</span><span class="rd-done">GEDAAN</span></div>' +
      row('Type', esc(p.typeLabel), esc(d.typeLabel), diffType ? '--align-different' : null) +
      row('Duur', cfDur_(p.duurMin), cfDur_(d.duurMin), null) +
      row('IF', cfIfTxt_(p.ifv), cfIfTxt_(d.ifv), null) +
      row('TSS', (p.tss != null ? Math.round(p.tss) : '–'), (d.tss != null ? Math.round(d.tss) : '–'), null) +
      '</div>';
  }
  // ZoneCompare (§1bis): één rij per zone — faded gepland-omvang + massieve gedaan-balk
  // op één minuten-schaal. Hergebruikt de bestaande ZONE_VAR/ZONE_LABEL-buckets.
  var ZCOMPARE_ZONES_ = [
    { z: 1, label: 'Herstel', zv: '--zone-1', buckets: ['rust'] },
    { z: 2, label: 'Duur',    zv: '--zone-2', buckets: ['z2', 'low'] },
    { z: 3, label: 'Tempo',   zv: '--zone-3', buckets: ['tempo'] },
    { z: 4, label: 'Drempel', zv: '--zone-4', buckets: ['drempel', 'high'] },
    { z: 5, label: 'VO2max',  zv: '--zone-5', buckets: ['anaeroob', 'anaerobic'] }
  ];
  function zcSumByZone_(segs) {
    var by = {};
    (segs || []).forEach(function (s) { by[s.bucket] = (by[s.bucket] || 0) + (s.minuten || 0); });
    return ZCOMPARE_ZONES_.map(function (zn) { var m = 0; zn.buckets.forEach(function (b) { m += by[b] || 0; }); return Math.round(m); });
  }
  function zcRowHtml_(zn, plan, done, maxMin) {
    var planPct = Math.max(0, Math.min(100, plan / maxMin * 100));
    var donePct = Math.max(0, Math.min(100, done / maxMin * 100));
    var unplanned = plan === 0 && done > 0, skipped = plan > 0 && done === 0;
    var sub = unplanned ? '<span class="zc-tag zc-unplanned">niet gepland</span>'
            : skipped   ? '<span class="zc-tag zc-skipped">niet gereden</span>'
            : '<span class="zc-sub">gepland ' + plan + '′</span>';
    var doneCol = skipped ? 'var(--zcompare-tag-skipped)' : 'var(' + zn.zv + ')';
    return '<div class="zc-row">' +
      '<div class="zc-label"><span class="zc-dot" style="background:var(' + zn.zv + ')"></span>Z' + zn.z + ' ' + esc(zn.label) + '</div>' +
      '<div class="zc-track">' +
        '<div class="zc-plan" style="width:' + planPct.toFixed(1) + '%;background:color-mix(in srgb, var(' + zn.zv + ') var(--zcompare-plan-strength), transparent)"></div>' +
        '<div class="zc-done" style="width:' + donePct.toFixed(1) + '%;min-width:' + (done > 0 ? 3 : 0) + 'px;background:var(' + zn.zv + ')"></div>' +
      '</div>' +
      '<div class="zc-val"><span class="zc-done-min" style="color:' + doneCol + '">' + done + '′</span>' + sub + '</div></div>';
  }
  function coachZonesHtml_(c) {
    var plan = zcSumByZone_(c.planned ? c.planned.segmenten : null);
    var done = zcSumByZone_(c.done ? c.done.segmenten : null);
    var idx = [], maxMin = 1;
    for (var i = 0; i < ZCOMPARE_ZONES_.length; i++) {
      if (plan[i] <= 0 && done[i] <= 0) continue;          // alleen zones met gepland óf gedaan > 0
      idx.push(i); maxMin = Math.max(maxMin, plan[i], done[i]);
    }
    if (!idx.length) return '';
    var rows = idx.map(function (i) { return zcRowHtml_(ZCOMPARE_ZONES_[i], plan[i], done[i], maxMin); }).join('');
    return '<div class="zc-head"><span class="zc-overline">Zone-vergelijking · min</span>' +
      '<span class="zc-legend"><span class="zc-leg"><span class="zc-leg-plan"></span>gepland</span>' +
      '<span class="zc-leg"><span class="zc-leg-done"></span>gedaan</span></span></div>' +
      '<div class="zc-rows">' + rows + '</div>';
  }
  function coachPctHtml_(c) {
    if (c.state === 'different' || c.state === 'missed' || c.score == null) return '';
    var v = ALIGN_VAR_[c.state] || '--align-on-plan', pct = Math.max(0, Math.min(100, c.score));
    return '<div class="rd-pct"><div class="rd-pct-row"><span class="rd-pct-lbl">Uitvoering volgt plan</span>' +
      '<span class="rd-pct-val" style="color:var(' + v + ')">' + c.score + '%</span></div>' +
      '<div class="rd-pct-track"><div class="rd-pct-fill" style="width:' + pct + '%;background:var(' + v + ')"></div></div></div>';
  }
  function coachTitle_(c) { return (c.state === 'different') ? (c.done.typeLabel + '-rit · ' + cfDur_(c.done.duurMin)) : c.planned.naam; }
  function doneDetailHtml_(d) {
    var c = d.coach;
    return '<div class="dd-card">' +
      '<div class="dd-overline"><span class="dd-date">' + esc(d.kort) + ' · Voltooid</span>' + alignChip_(c.state, c.chipLabel) + '</div>' +
      '<div class="dd-badge">' + coachBadge_(c.done.typeLabel, c.done.badgeZone) + '</div>' +
      '<div class="wk-name">' + esc(coachTitle_(c)) + '</div>' +
      coachReadingHtml_(c) + coachZonesHtml_(c) + coachPctHtml_(c) + coachCallout_(c) + coachAdaptBtn_(d) +
      rideAffordanceHtml_(d.dateISO) + '</div>';
  }
  function gemistDetailHtml_(d) {
    var c = d.coach, p = c.planned;
    var planRow = '<div class="gd-planrow"><span class="gd-plan">Gepland: ' + cfDur_(p.duurMin) + ' · IF ' + cfIfTxt_(p.ifv) +
      ' · ' + (p.tss != null ? Math.round(p.tss) : '–') + ' TSS</span><span class="gd-niet">niet gereden</span></div>';
    var reasons = '<div class="disp-q">Wat was de reden?</div><div class="disp-row">' +
      Object.keys(DISP_LABEL).map(function (r) {
        var sel = !!(d.dispositie && d.dispositie.reason === r);
        // Toggle-to-clear: tik op de AL-gekozen chip → wist de dispositie (terug naar 't voorstel).
        var click = sel ? ('clearDisposition(\'' + d.dateISO + '\')') : ('setDisposition(\'' + d.dateISO + '\',\'' + r + '\')');
        var ttl = sel ? ' title="Tik nogmaals om te wissen"' : '';
        return '<button type="button" class="disp-btn' + (sel ? ' is-on' : '') + '"' + ttl + ' onclick="' + click + '">' + DISP_LABEL[r] + (sel ? ' ×' : '') + '</button>';
      }).join('') + '</div>';
    return '<div class="dd-card">' +
      '<div class="dd-overline"><span class="dd-date">' + esc(d.kort) + ' · Niet gereden</span>' + alignChip_('missed', c.chipLabel) + '</div>' +
      '<div class="dd-badge">' + coachBadge_(p.typeLabel, p.badgeZone) + '</div>' +
      '<div class="wk-name">' + esc(p.naam) + '</div>' + planRow +
      '<div class="gd-reasons">' + reasons + '</div>' + coachCallout_(c) + coachAdaptBtn_(d) + '</div>';
  }

  // Adaptatie-EXECUTIE: "Plan deze aanpassing" → bestaande override-replanner
  // (saveDayOverride). Omkeerbaar gratis (target toont OverriddenDetail + "Terug
  // naar voorstel"); idempotent via de server-`from`-tag → bron-dag bevestigt.
  function coachAdaptBtn_(d) {
    var ad = d && d.coach && d.coach.adaptatie;
    if (!ad) return '';
    if (ad.planned) {
      var tg = dagByISO_(ad.dISO);
      return '<div class="coach-adapt-done">✓ Aanpassing ingepland' + (tg ? ' op ' + esc(tg.kort) : '') + '</div>';
    }
    return '<button type="button" class="coach-adapt-btn" onclick="planAdaptatie_(\'' + d.dateISO + '\')">' +
      '<span class="coach-adapt-main">Plan deze aanpassing</span>' +
      (ad.label ? '<span class="coach-adapt-sub2">' + esc(ad.label) + '</span>' : '') + '</button>';
  }
  function planAdaptatie_(srcISO) {
    var d = dagByISO_(srcISO), ad = d && d.coach && d.coach.adaptatie;
    if (!ad || ad.planned) return;
    var payload = (ad.type === 'free')
      ? { type: 'free', ritType: ad.ritType, intensiteit: ad.intensiteit, durMin: ad.durMin, from: ad.from, src: ad.src }
      : { type: 'library', workoutType: ad.workoutType, variantId: ad.variantId, durMin: ad.durMin, from: ad.from, src: ad.src };
    var btn = document.querySelector('.coach-adapt-btn'); if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(onState).withFailureHandler(showError).saveDayOverride(ad.dISO, payload);
  }

  // Dagstrip-dots: zone-getokeniseerd (bucket → --zone-*); 2 dots bij dubbele sessie.
  // Actieve override → één dot in de override-zone. saveDayOverride replant niet,
  // dus d.voorstel toont nog 't oude voorstel; lees dezelfde bron als OverriddenDetail:
  // library-override → categorie-zoneVar (trnCatByType_); free-ride → intensiteit→bucket.
  var FR_DOT_BUCKET_ = { rustig: 'z2', tempo: 'tempo', stevig: 'drempel' };
  function overrideDotZone_(ov) {
    if (!ov) return null;
    if (ov.type === 'free') return ZONE_VAR[FR_DOT_BUCKET_[ov.intensiteit] || 'z2'] || '--zone-2';
    var cat = trnCatByType_(ov.workoutType);
    return (cat && cat.zoneVar) ? cat.zoneVar : null;
  }
  function stripDots_(d) {
    if (d.override && (d.status === 'gepland' || d.status === 'vandaag')) {
      var oz = overrideDotZone_(d.override);
      if (oz) return '<span class="dot" style="background:var(' + oz + ')"></span>';
    }
    if (!d.voorstel || (d.status !== 'gepland' && d.status !== 'vandaag')) return '';
    var lists = (d.voorstel.sessies && d.voorstel.sessies.length > 1)
      ? d.voorstel.sessies.map(function (s) { return s.segmenten; })
      : [d.voorstel.segmenten];
    return lists.map(function (segs) {
      var last = (segs && segs.length) ? segs[segs.length - 1] : null;
      var z = (last && ZONE_VAR[last.bucket]) ? ZONE_VAR[last.bucket] : '--zone-2';
      return '<span class="dot" style="background:var(' + z + ')"></span>';
    }).join('');
  }

  var AVAIL_MIN = 30, AVAIL_MAX = 360, AVAIL_STEP = 15;

  function availSheetHtml() {
    var seg = '<div class="av-seg">' +
      '<button type="button" class="av-seg-btn' + (availScope === 'dag' ? ' is-on' : '') + '" onclick="availSetScope(\'dag\')">Alleen deze dag</button>' +
      '<button type="button" class="av-seg-btn' + (availScope === 'week' ? ' is-on' : '') + '" onclick="availSetScope(\'week\')">Deze week</button>' +
      '<button type="button" class="av-seg-btn' + (availScope === 'volgende' ? ' is-on' : '') + '" onclick="availSetScope(\'volgende\')">Volgende week</button>' +
    '</div>';
    var body;
    if (availScope === 'week' || availScope === 'volgende') {
      body = availSel.map(function (d, i) { return availDayControls_(i, d); }).join('');
    } else {
      var idx = availDayIdx_();
      body = availDayControls_(idx, availSel[idx] || { train: false, minuten: 0, pendel: false, dagLabel: '' });
    }
    return '<div class="av-title">Beschikbaarheid</div>' + seg +
      '<div class="av-body">' + body + '</div>' +
      '<button type="button" class="av-save" onclick="saveAvailEditor()">Opslaan</button>' +
      '<button type="button" class="av-cancel" data-overlay-close>Annuleren</button>';
  }
  function availRender_() {
    var c = document.getElementById('overlay-content');
    if (c) c.innerHTML = availSheetHtml();
  }
  function availLoad_(week) {   // laad availSel uit de juiste week (current = state.availability, volgende = +1)
    var src = (week === 'volgende') ? (state.availabilityPlus1 || []) : (state.availability || []);
    availSel = src.map(function (d) {
      return { train: !!d.train, minuten: Number(d.minuten) || 0, pendel: (d.dagtype === 'pendel'), dagLabel: d.dagLabel };
    });
    availLoadedWeek = week;
  }
  function openAvailEditor() {
    availScope = 'dag';
    availLoad_('current');
    openDrawer({ variant: 'sheet', html: availSheetHtml() });
  }
  function availSetScope(scope) {
    var w = (scope === 'volgende') ? 'volgende' : 'current';
    if (w !== availLoadedWeek) availLoad_(w);   // herlaad enkel bij week-wissel (behoud edits binnen dezelfde week)
    availScope = scope;
    availRender_();
  }
  function availSetTrain(idx, on) { if (availSel[idx]) { availSel[idx].train = on; availRender_(); } }
  function availSetPendel(idx, on) { if (availSel[idx]) availSel[idx].pendel = on; }
  function availSetMin(idx, v) {
    if (availSel[idx]) availSel[idx].minuten = Number(v) || 0;
    var lbl = document.querySelector('.av-minval[data-idx="' + idx + '"]');
    if (lbl) lbl.textContent = (Number(v) || 0) + ' min';
  }
  function saveAvailEditor() {
    var plus1 = (availScope === 'volgende');
    var updates = availSel.map(function (d, i) {
      var dagtype = d.pendel ? 'pendel' : ((i === 5 || i === 6) ? 'weekend' : 'vrij');
      return { train: !!d.train, minuten: availMins_(d), dagtype: dagtype };
    });
    var btn = document.querySelector('.av-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Opslaan…'; }
    var runner = google.script.run
      .withSuccessHandler(function (s) { closeDrawer(); onState(s); if (plus1) setActStatus('✅ Volgende week opgeslagen'); })
      .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.textContent = 'Opslaan'; } showError(err); });
    if (plus1) runner.saveAvailabilityPlus1(updates); else runner.saveAvailability(updates);
  }

  function renderDagDetail() {
    var d = (state.dagen || []).filter(function (x) { return x.dateISO === selectedDate; })[0];
    var el = document.getElementById('dag-detail');
    if (!d) { el.innerHTML = ''; return; }
    var h = '<div class="muted" style="text-transform:capitalize;margin-bottom:6px">' + esc(d.weekdag) + ' ' + esc(d.kort) + '</div>';

    // TEMP rdydemo — verwijder bij close-out: ?rdydemo=caution|rest injecteert een synthetische suggest-coach op elke plannbare dag.
    (function () {
      var m = /[?&]rdydemo=(caution|rest)/.exec(window.location.search || '');
      if (m && trnPlannable_(d) && !d.override && !d.coach) {
        var rd = m[1];
        d.coach = { kind: 'readiness', status: rd, gereedheid: (rd === 'rest' ? 42 : 54), reden: (rd === 'rest' ? 'rest_key' : 'caution_key'),
          fromType: 'vo2max', toType: (rd === 'rest' ? 'recovery' : 'tempo'),
          fromNaam: 'VO2max 5×4min', toNaam: (rd === 'rest' ? 'Herstelrit' : 'Tempo-rit'),
          regel: 'Demo — gereedheid laag; sessie verlicht voor beter herstel.',
          adaptatie: { dISO: d.dateISO, type: 'free', ritType: 'vrij', intensiteit: (rd === 'rest' ? 'rustig' : 'tempo'),
            durMin: 75, src: 'readiness', label: 'Verlicht vandaag' } };
      }
    })();
    // STAP 2 mount — boven álle takken (suggest boven voorstelKaart; committed boven overrideKaart_).
    if (d.coach && d.coach.kind === 'readiness') h += readinessBannerHtml_(d);

    var ov = d.override || null;
    var plannable = trnPlannable_(d);

    if (ov && plannable) {
      // Handmatig gekozen wint van het coach-voorstel (OverriddenDetail / FreeRideCard).
      h += overrideKaart_(d.dateISO, ov);
    } else if (d.coach && d.coach.state === 'missed') {
      h += gemistDetailHtml_(d);                       // GemistDetail (frame 10)
    } else if (d.coach && d.coach.done) {
      h += doneDetailHtml_(d);                         // DoneDetail (frame 08/09)
    } else if (d.status === 'gemist') {
      h += gemistKaart_(d);                            // fallback (geen coach-data)
    } else if (d.status === 'vandaag') {
      // Schema = puur trainingsgericht; readiness/Garmin-verwachting leven op Vorm.
      var v = state.vandaag;
      if (v.status === 'rust') {
        h += '<div class="card"><h3>Rustdag</h3><div class="muted">Geen training gepland vandaag. Herstel is training.</div></div>';
      } else {
        if (v.voorstel) h += voorstelKaart(v.voorstel, { overline: 'Vandaag', today: true });
        if (v.actual)   h += actualKaart(v.actual, d.dateISO);
        if (!v.voorstel && !v.actual) h += '<div class="card"><div class="muted">Nog geen voorstel — tik ↻ om te genereren.</div></div>';
        if (canDispose_(d)) h += dispositieAffordanceHtml_(d.dateISO);
      }
    } else if (d.status === 'preview') {
      h += '<div class="card"><div class="muted">Volgende week — ' +
        (d.previewMin ? '~' + d.previewMin + ' min gepland (nog niet uitgewerkt)' : 'nog niet ingepland') + '</div></div>';
    } else if (d.status === 'voltooid' && d.actual) {
      h += actualKaart(d.actual, d.dateISO);
      if (d.voorstel) h += voorstelKaart(d.voorstel, { overline: 'Gepland' });
    } else if (d.voorstel) {
      h += voorstelKaart(d.voorstel, { overline: 'Voorstel' });
      if (canDispose_(d)) h += dispositieAffordanceHtml_(d.dateISO);
    } else {
      h += '<div class="card"><div class="muted">Geen training deze dag.</div></div>';
    }
    // §144: "Andere training kiezen" → WorkoutPicker (alleen op plannbare dagen).
    if (plannable) h += '<button type="button" class="trn-pick-btn" onclick="openPicker(\'' + d.dateISO + '\')">Andere training kiezen</button>';
    // §102: Beschikbaarheid-knop per-dag, onder de dag-detail (opent de editor voor selectedDate).
    h += '<button id="btn-avail" class="avail-open" onclick="openAvailEditor()">Beschikbaarheid aanpassen</button>';
    el.innerHTML = h;
    // FIX 2: upgrade de Gedaan-zonebar + classificatie naar reële zones (lazy/cached).
    if (d.coach && d.coach.done && !d.coach.done.zonesReal) maybeUpgradeCoachZones_(d.dateISO);
  }

  // ── Vorm: status-first ──
  var STATUS_DEF = {
    'Bouwt op':   { cls: 'st-bouwt',  bg: 'st-bouwt-bg',  verdict: 'Je bouwt fitheid op.',
      uitleg: 'Je trainingslast stijgt sneller dan je fitheid is ingehaald. In een opbouwblok precies goed: je vraagt meer dan je lijf gewend is, zo groeit vorm. Houd herstel in de gaten.' },
    'Onderhoudt': { cls: 'st-onderh', bg: 'st-onderh-bg', verdict: 'Je houdt je fitheid vast.',
      uitleg: 'Je traint genoeg om fitheid vast te houden, niet genoeg om te groeien. Prima in onderhoud of taper; suboptimaal als je wilt opbouwen.' },
    'Te veel':    { cls: 'st-teveel', bg: 'st-teveel-bg', verdict: 'Je vermoeidheid loopt voor.',
      uitleg: 'Je vermoeidheid loopt flink voor op je fitheid. Een paar dagen kan, langer is blessure-/overtraining-risico. Plan herstel in.' },
    'Achteruit':  { cls: 'st-achter', bg: 'st-achter-bg', verdict: 'Fitheid zakt langzaam weg.',
      uitleg: 'Je bent erg uitgerust — te lang weinig prikkel en fitheid zakt langzaam weg. Bouw de last weer op, tenzij dit een bewuste rustweek is.' },
    'Fris':       { cls: 'st-fris',   bg: 'st-fris-bg',   verdict: 'Uitgerust, fitheid intact.',
      uitleg: 'Je bent uitgerust met fitheid grotendeels intact. Ideaal vlak voor een belangrijke rit of event.' }
  };

  function statusVoor(v) {
    if (!v.huidig) return null;
    var z = v.huidig.vormZone, ramp = v.huidig.ramp, rb = v.rampBuildMin != null ? v.rampBuildMin : 3;
    if (z === 'Hoog risico') return 'Te veel';
    if (z === 'Overgang')    return 'Achteruit';
    if (z === 'Fris')        return 'Fris';
    // Optimaal / Grijze zone
    return (ramp != null && ramp >= rb) ? 'Bouwt op' : 'Onderhoudt';
  }

  function ringSvg(dagenTot) {
    var r = 42, C = 2 * Math.PI * r;
    var frac = (dagenTot == null) ? 0 : Math.max(0, Math.min(1, 1 - dagenTot / 90));
    var fill = frac * C;
    return '<svg width="110" height="110" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:var(--ring-track)" stroke-width="9"></circle>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:var(--accent)" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + fill.toFixed(1) + ' ' + (C - fill).toFixed(1) + '"></circle></svg>';
  }

  // Gedeelde status-graphic (Vorm-tab + Vandaag). sfx = unieke suffix zodat
  // de "i"-uitleg per mount eigen id heeft (geen duplicate-id-conflict).
  function statusGraphicHtml(sfx) {
    var v = state.vorm, ev = v.event || {};
    var st = statusVoor(v);
    var def = st ? STATUS_DEF[st] : null;
    var dagen = ev.dagenTot;
    var ringMid = (dagen != null)
      ? '<div class="big">' + dagen + '</div><div class="lbl">dagen</div>'
      : '<div class="big">–</div><div class="lbl">geen event</div>';
    var sub = (dagen != null && ev.naam) ? 'tot ' + esc(ev.naam) : 'geen event gepland';
    var left = '<div class="status-left"><div class="ring-wrap">' + ringSvg(dagen) +
      '<div class="ring-mid">' + ringMid + '</div></div>' +
      '<div class="ring-sub">' + sub + '</div>' +
      (v.macroFase ? '<div class="fase-pill">' + esc(v.macroFase) + '</div>' : '') + '</div>';
    var right;
    if (def) {
      right = '<div class="status-right ' + def.bg + '">' +
        '<div class="status-i" onclick="toggleUitleg(\'' + sfx + '\')">i</div>' +
        '<div class="status-word ' + def.cls + '">' + st + '</div>' +
        '<div class="status-verdict">' + esc(def.verdict) + '</div></div>';
    } else {
      right = '<div class="status-right"><div class="status-verdict">Geen vorm-data.</div></div>';
    }
    // KAART 2 — W/kg-ankerniveau (2a; conditie-modifier volgt in 2b).
    // niveau/wkg staan top-level op state (niet op state.vorm).
    var nivGetal = (state.niveau != null) ? nl(state.niveau, 1) : '–';
    var nivWkg = (state.wkg != null) ? nl(state.wkg, 2) + ' W/kg' : '–';
    // 2b-2 adherence-subtekst, STRIKT binnen .niveau-block na .niveau-wkg.
    // voortgangPct staat top-level op state. Null → regel weglaten (geen "–% van plan").
    var voortgang = (state.voortgangPct != null)
      ? '<div class="niveau-voortgang">' + nl(state.voortgangPct, 0) + '% van plan</div>'
      : '<div class="niveau-voortgang">blok net gestart</div>';
    // 2b-3: beginniveau→huidig delta (− blijft − via nl). Geen begin-data → weglaten.
    var progressie = (state.niveauDelta != null && state.beginLabel)
      ? '<div class="niveau-progressie">' + (state.niveauDelta >= 0 ? '+' : '') +
        nl(state.niveauDelta, 1) + ' sinds ' + esc(state.beginLabel) + '</div>' : '';
    var card2 = '<div class="status-card"><div class="niveau-block">' +
      '<div class="niveau-getal">' + nivGetal + '</div>' +
      '<div class="niveau-label">Niveau</div>' +
      '<div class="niveau-wkg">' + nivWkg + '</div>' + voortgang + progressie + '</div></div>';

    return '<div class="status-wrap" id="swrap-' + sfx + '" onscroll="syncDots(\'' + sfx + '\')">' +
      '<div class="status-card">' + left + right + '</div>' + card2 + '</div>' +
      '<div class="status-dots" id="sdots-' + sfx + '"><span class="dot active"></span><span class="dot"></span></div>' +
      '<div class="explainer" id="vorm-uitleg-' + sfx + '" style="display:none">' +
      (def ? esc(def.uitleg) : '') + '</div>';
  }

  // Dot-indicator synct met de swipe-positie van de status-deck.
  function syncDots(sfx) {
    var track = document.getElementById('swrap-' + sfx);
    var dots = document.getElementById('sdots-' + sfx);
    if (!track || !dots) return;
    var idx = Math.round(track.scrollLeft / track.clientWidth);
    for (var i = 0; i < dots.children.length; i++) {
      dots.children[i].classList.toggle('active', i === idx);
    }
  }
  // ── Fase 1b — ReadinessCard (export §2a). Vervangt de oude Vorm-deck. ──
  // Eigen ring (0-100, band-gekleurd) los van de countdown-ringSvg.
  function readinessRing_(score, colorVar) {
    var r = 42, C = 2 * Math.PI * r;
    var frac = (score == null) ? 0 : Math.max(0, Math.min(1, score / 100));
    var fill = frac * C;
    return '<div class="rc-ring">' +
      '<svg width="118" height="118" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:var(--readiness-ring-track)" stroke-width="9"></circle>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" style="stroke:' + colorVar + '" stroke-width="9" stroke-linecap="round" ' +
      'transform="rotate(-90 50 50)" stroke-dasharray="' + fill.toFixed(1) + ' ' + (C - fill).toFixed(1) + '"></circle></svg>' +
      '<div class="rc-ring-mid">' + (score == null ? '–' : score) + '</div></div>';
  }

  var RC_VERDICT = { ready: 'Klaar voor een harde dag', caution: 'Houd het rustig — kies behoud', rest: 'Vandaag rust aangeraden' };
  var RC_BANDVAR = { ready: 'var(--readiness-ready)', caution: 'var(--readiness-caution)', rest: 'var(--readiness-rest)' };
  var RC_DOTVAR  = { good: 'var(--good)', warn: 'var(--warn)', muted: 'var(--text-muted)' };

  function readinessCardHtml(rd) {
    if (!rd || rd.score == null) return '<div class="card muted">Readiness nog niet te berekenen.</div>';
    var band = rd.band || 'rest';
    var bandVar = RC_BANDVAR[band] || 'var(--text-muted)';

    var chips = (rd.chips || []).map(function (c) {
      return (c.tone === 'fresh')
        ? '<span class="rc-chip" style="color:var(--fresh);background:var(--fresh-soft)">' + esc(c.label) + '</span>'
        : '<span class="rc-chip" style="color:var(--text-muted)">' + esc(c.label) + '</span>';
    }).join('');

    var rows = (rd.factors || []).map(function (f) {
      var dotVar = RC_DOTVAR[f.dot] || 'var(--text-muted)';
      return '<div class="rc-frow">' +
        '<span class="rc-flabel">' + esc(f.label) + '</span>' +
        '<span class="rc-fdot" style="background:' + dotVar + '"></span>' +
        '<span class="rc-fval">' + esc(f.valueText) + '</span>' +
        '</div>';
    }).join('');

    return '<div class="rc-card">' +
      '<div class="rc-overline">Status · Vandaag</div>' +
      '<div class="rc-top">' + readinessRing_(rd.score, bandVar) +
        '<div class="rc-side">' +
          '<div class="rc-verdict">' + esc(RC_VERDICT[band] || '') + '</div>' +
          (chips ? '<div class="rc-chips">' + chips + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<details class="rc-why"><summary>Waarom dit cijfer?</summary>' +
        '<div class="rc-factors">' + rows + '</div></details>' +
      (rd.checkinDone
        ? checkinDoneHtml_(rd)
        : '<div class="rc-checkin" onclick="openCheckin()">+ Ochtend-check-in invullen</div>') +
    '</div>';
  }

  function renderVormStatus() {
    document.getElementById('vorm-status').innerHTML = readinessCardHtml(state.readiness);
  }

  // ── Fase 2 — Ochtend-check-in (bottom sheet via overlay-primitive) ──
  var CHECKIN_Q = [
    { key: 'slaap',  label: 'Slaap',  opts: ['goed', 'matig', 'slecht'] },
    { key: 'benen',  label: 'Benen',  opts: ['fris', 'normaal', 'zwaar'] },
    { key: 'stress', label: 'Stress', opts: ['laag', 'normaal', 'hoog'] }
  ];
  function checkinAllSet_() { return !!(checkinSel.slaap && checkinSel.benen && checkinSel.stress); }
  function checkinSheetHtml() {
    var groups = CHECKIN_Q.map(function (q) {
      var segs = q.opts.map(function (o) {
        var on = (checkinSel[q.key] === o) ? ' is-on' : '';
        return '<button type="button" class="ci-seg' + on + '" data-val="' + o + '" onclick="checkinPick(\'' + q.key + '\',\'' + o + '\')">' + o + '</button>';
      }).join('');
      return '<div class="ci-group"><div class="ci-label">' + q.label + '</div>' +
        '<div class="ci-segs" data-ci-row="' + q.key + '">' + segs + '</div></div>';
    }).join('');
    var later = (state.readiness && state.readiness.checkinDone) ? 'Annuleren' : 'Later';
    return '<div class="ci-title">Ochtend-check-in</div>' + groups +
      '<button type="button" class="ci-save" onclick="submitCheckin()"' + (checkinAllSet_() ? '' : ' disabled') + '>Vastleggen</button>' +
      '<button type="button" class="ci-later" data-overlay-close>' + later + '</button>';
  }
  function openCheckin() { openDrawer({ variant: 'sheet', html: checkinSheetHtml() }); }
  function checkinPick(key, val) {
    checkinSel[key] = val;
    document.querySelectorAll('[data-ci-row="' + key + '"] .ci-seg').forEach(function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-val') === val);
    });
    var save = document.querySelector('.ci-save');
    if (save) save.disabled = !checkinAllSet_();
  }
  function submitCheckin() {
    if (!checkinAllSet_()) return;
    var btn = document.querySelector('.ci-save');
    if (btn) { btn.disabled = true; btn.textContent = 'Bezig…'; }
    google.script.run
      .withSuccessHandler(function (rd) { state.readiness = rd; closeDrawer(); renderVormStatus(); var t = document.getElementById('trn-status'); if (t) t.innerHTML = readinessCardHtml(state.readiness); })
      .withFailureHandler(function (err) { if (btn) { btn.disabled = false; btn.textContent = 'Vastleggen'; } showError(err); })
      .saveCheckin(checkinSel.slaap, checkinSel.benen, checkinSel.stress);
  }
  function maybeAutoOpenCheckin() {
    if (checkinAutoOpened) return;
    if (state.readiness && state.readiness.checkinDone === false) {
      checkinAutoOpened = true;
      setTimeout(openCheckin, 400);   // na de eerste render; dismissbaar via scrim/Esc
    }
  }
  // ReadinessCard-onderkant in ingevuld-staat: samenvatting + ronde +-knop + effect-callout.
  function checkinDoneHtml_(rd) {
    var d = rd.checkinDelta || 0;
    var effect = (d === 0) ? 'Check-in: geen effect op je score'
      : 'Check-in: ' + (d > 0 ? '+' + d : d) + ' op je score';

      '<div class="rc-done-row">' +
        '<span class="rc-done-sum">' + esc(rd.checkinSummary || '') + '</span>' +

  window.openCheckin = openCheckin;
  function toggleUitleg(sfx) {
    var el = document.getElementById('vorm-uitleg-' + sfx);
    if (el) el.style.display = (el.style.display === 'none') ? 'block' : 'none';
  }

  // Vorm-A (pakket §2b) — LevelCard W/kg-GELEID: W/kg-hero + W/kg-tier-chip (NV_TIERS,
  // ZELFDE bron als de Niveau-tab) + tier-voortgangsbalk (positie binnen de band) +
  // W/kg-delta. "x/50" + de niveau-hero + blok-% zijn losgelaten.
  function levelCardHtml(s) {
    var wkg = (s.ftp && s.gewicht) ? (s.ftp / s.gewicht) : null;
    if (wkg == null) return '<div class="rc-card muted">Geen W/kg-data — verbind je account.</div>';
    var ti = nvTierIndex_(wkg);
    var lower = ti > 0 ? NV_TIERS[ti - 1].max : 0;
    var upper = NV_TIERS[ti].max;
    var last = ti >= NV_TIERS.length - 1;
    var pct = last ? 100 : Math.max(0, Math.min(100, (wkg - lower) / (upper - lower) * 100));
    var nextLbl = last ? 'Hoogste tier bereikt' : ('nog ' + nl(upper - wkg, 1) + ' tot ' + NV_TIERS[ti + 1].l);
    // W/kg-delta over de progressie-reeks (zelfde W/kg-bron als Niveau-tab).
    var prog = (state.niveauProgressie || []).filter(function (p) { return p.wkg != null; });
    var dWkg = (prog.length >= 2) ? Math.round((prog[prog.length - 1].wkg - prog[0].wkg) * 100) / 100 : null;
    var deltaLine = (dWkg != null && dWkg !== 0 && s.beginLabel)
      ? '<div class="lc-delta-line ' + (dWkg > 0 ? 'lc-up' : 'lc-down') + '">' +
          (dWkg > 0 ? '+' : '−') + nl(Math.abs(dWkg), 1) + ' W/kg ' + (dWkg > 0 ? '↑' : '↓') + ' sinds ' + esc(s.beginLabel) + '</div>'
      : '';
    return '<div class="rc-card">' +
      '<div class="lc-head"><div class="rc-overline">Niveau</div><span class="lc-chip"><span class="lc-dot"></span>' + esc(NV_TIERS[ti].l) + '</span></div>' +
      '<div class="lc-row"><div class="lc-num">' + nl(wkg, 1) + '<span class="lc-max">W/kg</span></div></div>' +

  // ── Niveau Fase-2 §d — DoelProjectie: gap-rijen + uren→potentieel what-if.
  // SOLIDE volume→CTL-ramp (berekend) vs SPECULATIEVE FTP-band (schatting). Slider recomputet
  // CLIENT-side met dezelfde formules als de server (géén google.script.run per slide). ──
  var nvDoelHours = null;     // what-if uren/week
  var nvDoelAssum = false;    // aannames uitgeklapt
  function nvHoursHuman_(h) {
    if (h == null) return '–';
    var whole = Math.floor(h), mins = Math.round((h - whole) * 60);
    if (mins === 60) { whole += 1; mins = 0; }

  }
  function nvDoelDuurTarget_() {
    var dims = (state.goalProfile && state.goalProfile.dims) ? state.goalProfile.dims : [];

  function nvCtlPlateau_(h, tssPerH) { return (!h || !tssPerH) ? 0 : Math.round((h * tssPerH / 7) * 10) / 10; }

  function nvDoelChartSvg_(hours, w) {
    var p = state.projection, target = nvDoelDuurTarget_();

        cTxt = cssColor_('var(--text-secondary)'), cMut = cssColor_('var(--text-muted)'),

    var area = rampD + ' L' + X(WEEKS).toFixed(1) + ' ' + (padT + ph).toFixed(1) + ' L' + X(0).toFixed(1) + ' ' + (padT + ph).toFixed(1) + ' Z';
    var wk = isTest ? null : nvCtlWeeks_(cur0, ceil, target), readyX = (wk != null && wk <= WEEKS) ? X(wk) : null;
    var testX = null, testY = null;

    s += '<path d="' + area + '" fill="' + cFill + '"/>';
    s += '<path d="' + rampD + '" fill="none" stroke="' + cSolid + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    s += '<circle cx="' + X(0).toFixed(1) + '" cy="' + Y(cur0).toFixed(1) + '" r="3.5" fill="' + cPt + '"/>';
    if (readyX != null) {
      s += '<line x1="' + readyX.toFixed(1) + '" x2="' + readyX.toFixed(1) + '" y1="' + Y(target).toFixed(1) + '" y2="' + (padT + ph).toFixed(1) + '" stroke="' + cReady + '" stroke-width="1.5"/>';

      s += '<circle cx="' + testX.toFixed(1) + '" cy="' + testY.toFixed(1) + '" r="5" fill="' + cReady + '" stroke="' + cSurf + '" stroke-width="2"/>';

  function nvDoelReadoutHtml_(hours) {

        '<div class="nvd-readout-sub">Verwachte fitheid op de testdag: ~' + (ctlAtTest != null ? Math.round(ctlAtTest) : '–') + ' CTL</div>';
      if (warn) ht += '<div class="nvd-readout-sub">Bij <strong>' + hours + 'u/week</strong> zakt je fitheid richting de testdag — verhoog het volume voor een betere test.</div>';

      var sooner = (b != null) ? Math.max(0, Math.round(wk - b)) : 0;
      var h = '<div class="nvd-readout ok"><div class="nvd-readout-main">Duurdoel bereikt over <span class="nvd-readout-n">~' + Math.round(wk) + '</span> weken</div>';

  // Live recompute: werk-minuten (high+anaerobic) vast, extra duur → Z2 (low).

  function trnScale_(v, mins) {

    var newLow = Math.max(10, Math.round(mins - work));

      return { bucket: s.bucket, hoogtePct: s.hoogtePct, pctLo: s.pctLo, pctHi: s.pctHi,

    });
    return { durMin: dur, tss: tss, segmenten: scaled };
